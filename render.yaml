services:
  - type: web
    name: opentrace
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: OPENTRACE_DATA_DIR
        value: /data
      - key: OPENTRACE_LISTEN_ADDR
        value: ":8080"
      - key: OPENTRACE_LLM_PROVIDER
        sync: false
      - key: OPENTRACE_ANTHROPIC_API_KEY
        sync: false
      - key: OPENTRACE_OPENAI_API_KEY
        sync: false
      - key: OPENTRACE_API_KEY
        generateValue: true
    disk:
      name: opentrace-data
      mountPath: /data
      sizeGB: 1
