app = "opentrace"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  OPENTRACE_DATA_DIR = "/data"
  OPENTRACE_LISTEN_ADDR = ":8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      interval = "30s"
      timeout = "5s"
      grace_period = "10s"
      method = "GET"
      path = "/healthz"

[mounts]
  source = "opentrace_data"
  destination = "/data"
