{{define "content"}}
<div class="page-header">
  <h1><span class="prompt">$</span> servers</h1>
  <button class="btn btn-primary" onclick="toggleInstall()">+ add server</button>
</div>

<div id="install-panel" class="card" style="display:none; margin-bottom: 1.5rem;">
  <div style="padding: 1.25rem;">
    <h3 style="margin: 0 0 0.5rem 0;">Install Agent</h3>
    <p class="text-dim" style="margin: 0 0 1rem 0;">Run this on the server you want to monitor:</p>
    <div class="code-block" style="position: relative;">
      <button class="copy-btn" onclick="copyInstallCmd(this)">copy</button>
      <pre><code id="install-cmd">curl -fsSL <span id="install-url"></span> | sudo bash</code></pre>
    </div>
    <details style="margin-top: 1rem;">
      <summary class="text-dim" style="cursor: pointer;">manual setup</summary>
      <div style="margin-top: 0.75rem;">
        <p class="text-dim" style="margin: 0 0 0.5rem 0;">Or run the agent directly:</p>
        <div class="code-block" style="position: relative;">
          <button class="copy-btn" onclick="copyManualCmd(this)">copy</button>
          <pre><code id="manual-cmd"></code></pre>
        </div>
      </div>
    </details>
  </div>
</div>

<div id="servers-container">
  <div class="empty-state"><div class="empty-icon">--</div><p>loading...</p></div>
</div>

<script>
var baseURL = window.location.protocol + '//' + window.location.host;
var installURL = baseURL + '/api/agent/install.sh';

// Set install command URLs
document.getElementById('install-url').textContent = installURL;
document.getElementById('manual-cmd').textContent =
  'OPENTRACE_SERVER_URL=' + baseURL + ' \\\nopentrace agent';

function toggleInstall() {
  var panel = document.getElementById('install-panel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

function copyInstallCmd(btn) {
  var text = 'curl -fsSL ' + installURL + ' | sudo bash';
  copyAndFlash(btn, text);
}

function copyManualCmd(btn) {
  var text = 'OPENTRACE_SERVER_URL=' + baseURL + ' opentrace agent';
  copyAndFlash(btn, text);
}

function copyAndFlash(btn, text) {
  navigator.clipboard.writeText(text).then(function() {
    btn.textContent = 'copied!';
    btn.classList.add('copied');
    setTimeout(function() {
      btn.textContent = 'copy';
      btn.classList.remove('copied');
    }, 2000);
  });
}

(function(){
  function loadServers() {
    fetch('/api/servers').then(function(r){ return r.json(); }).then(function(servers){
      var container = document.getElementById('servers-container');
      if (!servers || servers.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">--</div><p>no servers monitored</p><p class="text-dim text-xs">run <code>opentrace agent</code> on a server to start collecting metrics</p></div>';
        return;
      }

      var html = '<div class="server-list">';
      servers.forEach(function(s){
        var statusClass = s.status === 'online' ? 'badge-connected' : s.status === 'offline' ? 'badge-error' : 'badge-disconnected';
        var lastSeen = s.last_seen_at ? getTimeAgo(s.last_seen_at) : 'never';

        html += '<a href="/servers/' + s.id + '" class="server-card card">';
        html += '  <div class="server-card-header">';
        html += '    <span class="server-hostname">' + escapeHtml(s.hostname) + '</span>';
        html += '    <span class="badge ' + statusClass + '">' + s.status + '</span>';
        html += '  </div>';
        html += '  <div class="server-card-meta">';
        if (s.ip_address) html += '<span>IP: ' + escapeHtml(s.ip_address) + '</span>';
        if (s.os) html += '<span>OS: ' + escapeHtml(s.os) + '/' + escapeHtml(s.arch || '') + '</span>';
        html += '    <span>last seen: ' + lastSeen + '</span>';
        html += '  </div>';
        html += '  <div class="server-card-metrics" id="srv-metrics-' + s.id + '"></div>';
        html += '</a>';
      });
      html += '</div>';
      container.innerHTML = html;

      // Load quick health metrics for each server
      servers.forEach(function(s) {
        fetch('/api/servers/' + s.id + '/metrics?name=cpu.usage_percent&limit=1')
        .then(function(r){ return r.json(); })
        .then(function(cpuData){
          return fetch('/api/servers/' + s.id + '/metrics?name=memory.usage_percent&limit=1')
          .then(function(r){ return r.json(); })
          .then(function(memData){
            return fetch('/api/servers/' + s.id + '/metrics?name=disk.usage_percent&limit=1')
            .then(function(r){ return r.json(); })
            .then(function(diskData){
              var el = document.getElementById('srv-metrics-' + s.id);
              if (!el) return;
              var parts = [];
              if (cpuData && cpuData.length > 0) parts.push('CPU: ' + cpuData[0].metric_value.toFixed(1) + '%');
              if (memData && memData.length > 0) parts.push('Mem: ' + memData[0].metric_value.toFixed(1) + '%');
              if (diskData && diskData.length > 0) parts.push('Disk: ' + diskData[0].metric_value.toFixed(1) + '%');
              el.innerHTML = parts.length > 0 ? parts.join(' &middot; ') : '';
            });
          });
        }).catch(function(){});
      });
    }).catch(function(){
      document.getElementById('servers-container').innerHTML = '<div class="empty-state"><div class="empty-icon">!!</div><p>failed to load servers</p></div>';
    });
  }

  function getTimeAgo(dateStr) {
    var now = new Date();
    var date = new Date(dateStr);
    var diff = Math.floor((now - date) / 1000);
    if (diff < 60) return diff + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  loadServers();
  setInterval(loadServers, 30000);
})();
</script>
{{end}}
