{{define "content"}}
<div class="watchers-page">
  <div class="page-header">
    <h1><span class="prompt">$</span> watchers</h1>
    <div class="actions">
      <span class="dim" style="font-size:11px">managed by Claude</span>
    </div>
  </div>

  <div class="filter-bar" id="watcher-filter-bar">
    <div class="filter-bar-tags">
      <div class="filter-tag" id="tag-status" onclick="toggleWatcherDropdown('status',event)" title="status — key: s">
        <span class="filter-tag-key">s:</span>
        <span class="filter-tag-val" id="tag-status-val">all</span>
        <div class="filter-dropdown" id="drop-status"></div>
      </div>
      <div class="filter-tag" id="tag-type" onclick="toggleWatcherDropdown('type',event)" title="type — key: t">
        <span class="filter-tag-key">t:</span>
        <span class="filter-tag-val" id="tag-type-val">all</span>
        <div class="filter-dropdown" id="drop-type"></div>
      </div>
      <div class="filter-tag" id="tag-severity" onclick="toggleWatcherDropdown('severity',event)" title="severity — key: v">
        <span class="filter-tag-key">v:</span>
        <span class="filter-tag-val" id="tag-severity-val">all</span>
        <div class="filter-dropdown" id="drop-severity"></div>
      </div>
    </div>
    <div class="filter-bar-actions">
      <span class="dim" id="watcher-filter-count"></span>
      <button type="button" class="filter-bar-btn btn-clear" onclick="clearWatcherFilters()">clear</button>
    </div>
  </div>

  <div id="watchers-list" class="watchers-list">
    <div class="loading-state">loading watchers</div>
  </div>
</div>

<!-- Simplified Edit Modal (review/tune only — creation is via Claude MCP) -->
<div id="edit-modal" class="modal" role="dialog" aria-modal="true" style="display:none" onclick="if(event.target===this)hideEditModal()">
  <div class="modal-content">
    <div class="modal-header">
      <h3><span class="prompt">$</span> <span id="edit-modal-title">edit-watcher</span></h3>
      <button class="btn-close" onclick="hideEditModal()">&times;</button>
    </div>
    <form id="edit-form" onsubmit="saveEditWatcher(event)">
      <div class="modal-body">
        <input type="hidden" id="edit-watcher-id" value="">
        <div class="modal-section">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="edit-title" required>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="edit-description" rows="2"></textarea>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label>Severity</label>
              <select id="edit-severity">
                <option value="info">Info</option>
                <option value="warning">Warning</option>
                <option value="critical">Critical</option>
              </select>
            </div>
            <div class="form-group">
              <label>Schedule</label>
              <select id="edit-timerange">
                <option value="1m">Every 1 min</option>
                <option value="5m">Every 5 min</option>
                <option value="15m">Every 15 min</option>
                <option value="30m">Every 30 min</option>
                <option value="1h">Every 1 hour</option>
                <option value="6h">Every 6 hours</option>
                <option value="24h">Every 24 hours</option>
              </select>
            </div>
            <div class="form-group">
              <label>Effort</label>
              <select id="edit-effort">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <div class="form-group" id="edit-model-group" style="display:none">
              <label>AI Model</label>
              <select id="edit-model">
                <option value="">Default (global)</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" onclick="hideEditModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" id="edit-save-btn">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script nonce="{{.CSPNonce}}">
var isAdmin = {{.IsAdmin}};

// --- Filter state ---
var STATUS_OPTIONS = ['', 'active', 'paused'];
var STATUS_LABELS  = ['all', 'active', 'paused'];
var TYPE_OPTIONS = ['', 'query', 'logs', 'health', 'ai', 'deadman', 'diff', 'composite', 'trend', 'sequence'];
var TYPE_LABELS  = ['all', 'query', 'logs', 'health', 'ai', 'deadman', 'diff', 'composite', 'trend', 'sequence'];
var SEV_OPTIONS = ['', 'critical', 'warning', 'info'];
var SEV_LABELS  = ['all', 'crit', 'warn', 'info'];
var currentStatusIdx = 0;
var currentTypeIdx = 0;
var currentSevIdx = 0;
var allWatchers = [];
var openDrop = null;

function getWatcherType(w) {
  if (w.watcher_type === 'rule' && w.rule_config) return w.rule_config.source || 'query';
  var typed = ['deadman', 'diff', 'composite', 'trend', 'sequence'];
  if (typed.indexOf(w.watcher_type) >= 0) return w.watcher_type;
  return 'ai';
}

function filterWatchers() {
  var status = STATUS_OPTIONS[currentStatusIdx];
  var type = TYPE_OPTIONS[currentTypeIdx];
  var sev = SEV_OPTIONS[currentSevIdx];
  return allWatchers.filter(function(w) {
    if (status && w.status !== status) return false;
    if (type && getWatcherType(w) !== type) return false;
    if (sev && w.severity !== sev) return false;
    return true;
  });
}

function updateFilterCount(filtered, total) {
  var el = document.getElementById('watcher-filter-count');
  if (currentStatusIdx === 0 && currentTypeIdx === 0 && currentSevIdx === 0) {
    el.textContent = '';
  } else {
    el.textContent = filtered + ' of ' + total + ' watchers';
  }
}

// --- Dropdown logic ---
function closeAllWatcherDropdowns() {
  document.querySelectorAll('#watcher-filter-bar .filter-dropdown.show').forEach(function(d){ d.classList.remove('show'); });
  openDrop = null;
}

function renderDropdown(dropId, options, labels, currentIdx, selectFn) {
  var drop = document.getElementById(dropId);
  var html = '';
  for (var i = 0; i < options.length; i++) {
    var cls = i === currentIdx ? 'filter-drop-item drop-active' : 'filter-drop-item';
    html += '<button type="button" class="' + cls + '" data-idx="' + i + '">' + escapeHtml(labels[i]) + '</button>';
  }
  drop.innerHTML = html;
  drop.querySelectorAll('.filter-drop-item').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      selectFn(parseInt(btn.getAttribute('data-idx')));
      closeAllWatcherDropdowns();
    });
  });
}

function toggleWatcherDropdown(name, e) {
  e.stopPropagation();
  var dropId = 'drop-' + name;
  var drop = document.getElementById(dropId);
  var wasOpen = drop.classList.contains('show');
  closeAllWatcherDropdowns();
  if (wasOpen) return;
  if (name === 'status') renderDropdown(dropId, STATUS_OPTIONS, STATUS_LABELS, currentStatusIdx, selectStatus);
  else if (name === 'type') renderDropdown(dropId, TYPE_OPTIONS, TYPE_LABELS, currentTypeIdx, selectType);
  else if (name === 'severity') renderDropdown(dropId, SEV_OPTIONS, SEV_LABELS, currentSevIdx, selectSeverity);
  drop.classList.add('show');
  openDrop = dropId;
}
window.toggleWatcherDropdown = toggleWatcherDropdown;

document.addEventListener('click', function(){ closeAllWatcherDropdowns(); });

// --- Tag display & flash ---
function updateTagDisplay(elId, text, isActive) {
  var el = document.getElementById(elId);
  el.textContent = text;
  el.className = 'filter-tag-val' + (isActive ? ' val-active' : ' val-all');
}

function flashTag(tagId) {
  var el = document.getElementById(tagId);
  el.classList.remove('filter-flash');
  void el.offsetWidth;
  el.classList.add('filter-flash');
}

// --- Select & cycle ---
function selectStatus(idx) {
  currentStatusIdx = idx;
  updateTagDisplay('tag-status-val', STATUS_LABELS[idx], idx !== 0);
  flashTag('tag-status');
  syncToUrl();
  applyFilters();
}
function selectType(idx) {
  currentTypeIdx = idx;
  updateTagDisplay('tag-type-val', TYPE_LABELS[idx], idx !== 0);
  flashTag('tag-type');
  syncToUrl();
  applyFilters();
}
function selectSeverity(idx) {
  currentSevIdx = idx;
  updateTagDisplay('tag-severity-val', SEV_LABELS[idx], idx !== 0);
  flashTag('tag-severity');
  syncToUrl();
  applyFilters();
}
function cycleStatus(dir) { selectStatus((currentStatusIdx + dir + STATUS_OPTIONS.length) % STATUS_OPTIONS.length); }
function cycleType(dir) { selectType((currentTypeIdx + dir + TYPE_OPTIONS.length) % TYPE_OPTIONS.length); }
function cycleSeverity(dir) { selectSeverity((currentSevIdx + dir + SEV_OPTIONS.length) % SEV_OPTIONS.length); }

function clearWatcherFilters() {
  currentStatusIdx = 0;
  currentTypeIdx = 0;
  currentSevIdx = 0;
  updateTagDisplay('tag-status-val', STATUS_LABELS[0], false);
  updateTagDisplay('tag-type-val', TYPE_LABELS[0], false);
  updateTagDisplay('tag-severity-val', SEV_LABELS[0], false);
  syncToUrl();
  applyFilters();
}
window.clearWatcherFilters = clearWatcherFilters;

function applyFilters() {
  var filtered = filterWatchers();
  updateFilterCount(filtered.length, allWatchers.length);
  renderWatchers(filtered);
}

// --- URL sync ---
function syncToUrl() {
  var params = new URLSearchParams();
  if (STATUS_OPTIONS[currentStatusIdx]) params.set('status', STATUS_OPTIONS[currentStatusIdx]);
  if (TYPE_OPTIONS[currentTypeIdx]) params.set('type', TYPE_OPTIONS[currentTypeIdx]);
  if (SEV_OPTIONS[currentSevIdx]) params.set('severity', SEV_OPTIONS[currentSevIdx]);
  var qs = params.toString();
  var url = window.location.pathname + (qs ? '?' + qs : '');
  history.replaceState(null, '', url);
}

function initFromUrl() {
  var params = new URLSearchParams(window.location.search);
  var s = params.get('status') || '';
  var si = STATUS_OPTIONS.indexOf(s);
  if (si >= 0) currentStatusIdx = si;
  var t = params.get('type') || '';
  var ti = TYPE_OPTIONS.indexOf(t);
  if (ti >= 0) currentTypeIdx = ti;
  var v = params.get('severity') || '';
  var vi = SEV_OPTIONS.indexOf(v);
  if (vi >= 0) currentSevIdx = vi;
  updateTagDisplay('tag-status-val', STATUS_LABELS[currentStatusIdx], currentStatusIdx !== 0);
  updateTagDisplay('tag-type-val', TYPE_LABELS[currentTypeIdx], currentTypeIdx !== 0);
  updateTagDisplay('tag-severity-val', SEV_LABELS[currentSevIdx], currentSevIdx !== 0);
}

// --- Keyboard shortcuts ---
document.addEventListener('keydown', function(e){
  var tag = document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  var overlay = document.getElementById('shortcut-overlay');
  if (overlay && overlay.style.display !== 'none') return;
  // Skip if any modal is visible
  var modals = document.querySelectorAll('.modal[style*="flex"]');
  if (modals.length > 0) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  closeAllWatcherDropdowns();
  switch(e.key) {
    case 's': e.preventDefault(); cycleStatus(1); break;
    case 'S': e.preventDefault(); cycleStatus(-1); break;
    case 't': e.preventDefault(); cycleType(1); break;
    case 'T': e.preventDefault(); cycleType(-1); break;
    case 'v': e.preventDefault(); cycleSeverity(1); break;
    case 'V': e.preventDefault(); cycleSeverity(-1); break;
    case 'c': e.preventDefault(); clearWatcherFilters(); break;
  }
});

function getWatcherTypeBadge(w) {
  if (w.watcher_type === 'rule' && w.rule_config) {
    var src = w.rule_config.source;
    if (src === 'query') return '<span class="badge badge-type badge-query">query</span>';
    if (src === 'logs') return '<span class="badge badge-type badge-logs">logs</span>';
    if (src === 'health') return '<span class="badge badge-type badge-health">health</span>';
    return '<span class="badge badge-type">rule</span>';
  }
  if (w.watcher_type === 'deadman') return '<span class="badge badge-type badge-deadman">deadman</span>';
  if (w.watcher_type === 'diff') return '<span class="badge badge-type badge-diff">diff</span>';
  if (w.watcher_type === 'composite') return '<span class="badge badge-type badge-composite">composite</span>';
  if (w.watcher_type === 'trend') return '<span class="badge badge-type badge-trend">trend</span>';
  if (w.watcher_type === 'sequence') return '<span class="badge badge-type badge-sequence">sequence</span>';
  return '<span class="badge badge-type badge-ai">AI</span>';
}

function getAdaptiveBadge(w) {
  if (!w.adaptive_config || !w.adaptive_config.enabled) return '';
  var s = w.adaptive_state || 'normal';
  if (s === 'normal') return '<span class="badge badge-adaptive" title="Running on regular schedule">normal</span>';
  if (s === 'escalated') return '<span class="badge badge-adaptive badge-escalated" title="Anomaly detected \u2014 checking more frequently to track the issue">&#8593; escalated</span>';
  if (s === 'sustained') return '<span class="badge badge-adaptive badge-sustained" title="Alert ongoing \u2014 returned to normal check frequency while issue persists">&#8252; sustained</span>';
  if (s === 'relaxed') return '<span class="badge badge-adaptive badge-relaxed" title="All clear for a while \u2014 checking less often to save resources">&#8595; relaxed</span>';
  if (s === 'backing_off') return '<span class="badge badge-adaptive badge-backoff" title="Repeated failures (' + (w.consecutive_errors || 0) + ' errors) \u2014 reducing check frequency to avoid overload">&#8634; backoff</span>';
  if (s === 'error') return '<span class="badge badge-adaptive badge-adaptive-error" title="Paused after ' + (w.consecutive_errors || 0) + ' consecutive errors \u2014 click Resume to restart">&#9888; paused</span>';
  return '';
}

function getTypedWatcherSummary(w) {
  if (!w.type_config) return '';
  var cfg = w.type_config;
  if (w.watcher_type === 'deadman') {
    var filter = cfg.filter || {};
    var parts = [];
    if (filter.service) parts.push(filter.service);
    if (filter.level) parts.push(filter.level);
    if (filter.query) parts.push('"' + filter.query + '"');
    var src = cfg.source === 'query' ? 'query results' : (parts.length ? parts.join(' ') + ' logs' : 'events');
    return 'Alert if fewer than ' + (cfg.min_count || 0) + ' ' + src + ' in ' + (cfg.window || '?');
  }
  if (w.watcher_type === 'diff') {
    var mode = cfg.compare_mode || 'hash';
    var modeLabel = mode === 'hash' ? 'hash comparison' : mode === 'row_count' ? 'row count change' : 'exact comparison';
    return 'Detect changes via ' + modeLabel + (cfg.change_threshold ? ' (>' + cfg.change_threshold + '%)' : '');
  }
  if (w.watcher_type === 'composite') {
    var logic = cfg.logic || 'all_of';
    var logicLabel = logic === 'all_of' ? 'ALL of' : logic === 'any_of' ? 'ANY of' : 'NONE of';
    var n = (cfg.conditions || []).length;
    var labels = (cfg.conditions || []).map(function(c){ return c.label || 'condition'; });
    return logicLabel + ' ' + n + ' conditions: ' + labels.join(', ');
  }
  if (w.watcher_type === 'trend') {
    var dir = cfg.direction === 'increase' ? 'increases' : cfg.direction === 'decrease' ? 'decreases' : 'changes';
    var filter = cfg.filter || {};
    var src = cfg.source === 'query' ? 'query value' : (filter.level ? filter.level + ' log count' : 'log count');
    if (filter.service) src = filter.service + ' ' + src;
    return 'Alert when ' + src + ' ' + dir + ' >' + (cfg.change_percent || 0) + '% vs ' + (cfg.baseline_runs || 0) + '-run baseline';
  }
  if (w.watcher_type === 'sequence') {
    var steps = cfg.steps || [];
    var labels = steps.map(function(s){ return s.label || s.source; });
    return steps.length + '-step pattern in ' + (cfg.window || '?') + ': ' + labels.join(' \u2192 ');
  }
  return '';
}

function renderTypedConfigDetail(w) {
  if (!w.type_config) return '';
  var cfg = w.type_config;
  var html = '';

  if (w.watcher_type === 'deadman') {
    html += '<div class="alert-detail-row"><span class="alert-detail-key">source</span><span class="alert-detail-val">' + (cfg.source || '?') + '</span></div>';
    html += '<div class="alert-detail-row"><span class="alert-detail-key">min count</span><span class="alert-detail-val">' + (cfg.min_count || 0) + ' events</span></div>';
    html += '<div class="alert-detail-row"><span class="alert-detail-key">window</span><span class="alert-detail-val">' + (cfg.window || '?') + '</span></div>';
    if (cfg.filter) {
      var f = cfg.filter;
      if (f.service) html += '<div class="alert-detail-row"><span class="alert-detail-key">service</span><span class="alert-detail-val">' + escapeHtml(f.service) + '</span></div>';
      if (f.level) html += '<div class="alert-detail-row"><span class="alert-detail-key">level</span><span class="alert-detail-val">' + escapeHtml(f.level) + '</span></div>';
      if (f.query) html += '<div class="alert-detail-row"><span class="alert-detail-key">query</span><span class="alert-detail-val">' + escapeHtml(f.query) + '</span></div>';
    }
    if (cfg.source === 'query' && cfg.query) {
      html += '<div class="alert-detail-row"><span class="alert-detail-key">SQL</span><span class="alert-detail-val" style="font-size:11px;white-space:pre-wrap">' + escapeHtml(cfg.query) + '</span></div>';
    }
  }

  if (w.watcher_type === 'diff') {
    html += '<div class="alert-detail-row"><span class="alert-detail-key">compare</span><span class="alert-detail-val">' + (cfg.compare_mode || 'hash') + '</span></div>';
    if (cfg.change_threshold) html += '<div class="alert-detail-row"><span class="alert-detail-key">threshold</span><span class="alert-detail-val">' + cfg.change_threshold + '%</span></div>';
    if (cfg.ignore_columns && cfg.ignore_columns.length) html += '<div class="alert-detail-row"><span class="alert-detail-key">ignore cols</span><span class="alert-detail-val">' + escapeHtml(cfg.ignore_columns.join(', ')) + '</span></div>';
    if (cfg.query) html += '<div class="alert-detail-row"><span class="alert-detail-key">SQL</span><span class="alert-detail-val" style="font-size:11px;white-space:pre-wrap">' + escapeHtml(cfg.query) + '</span></div>';
  }

  if (w.watcher_type === 'composite') {
    html += '<div class="alert-detail-row"><span class="alert-detail-key">logic</span><span class="alert-detail-val">' + (cfg.logic || 'all_of') + '</span></div>';
    (cfg.conditions || []).forEach(function(c, i) {
      var label = c.label || ('condition ' + (i+1));
      var detail = c.watcher_id ? 'watcher: ' + c.watcher_id : 'inline rule';
      html += '<div class="alert-detail-row"><span class="alert-detail-key">#' + (i+1) + '</span><span class="alert-detail-val">' + escapeHtml(label) + ' <span class="dim">(' + detail + ')</span></span></div>';
    });
  }

  if (w.watcher_type === 'trend') {
    html += '<div class="alert-detail-row"><span class="alert-detail-key">source</span><span class="alert-detail-val">' + (cfg.source || '?') + '</span></div>';
    html += '<div class="alert-detail-row"><span class="alert-detail-key">direction</span><span class="alert-detail-val">' + (cfg.direction || 'both') + '</span></div>';
    html += '<div class="alert-detail-row"><span class="alert-detail-key">threshold</span><span class="alert-detail-val">' + (cfg.change_percent || 0) + '% change</span></div>';
    html += '<div class="alert-detail-row"><span class="alert-detail-key">baseline</span><span class="alert-detail-val">' + (cfg.baseline_runs || 0) + ' runs</span></div>';
    if (cfg.filter) {
      var f = cfg.filter;
      var parts = [];
      if (f.service) parts.push('service=' + f.service);
      if (f.level) parts.push('level=' + f.level);
      if (f.query) parts.push('query="' + f.query + '"');
      if (parts.length) html += '<div class="alert-detail-row"><span class="alert-detail-key">filter</span><span class="alert-detail-val">' + escapeHtml(parts.join(', ')) + '</span></div>';
    }
    if (cfg.source === 'query' && cfg.query) {
      html += '<div class="alert-detail-row"><span class="alert-detail-key">SQL</span><span class="alert-detail-val" style="font-size:11px;white-space:pre-wrap">' + escapeHtml(cfg.query) + '</span></div>';
    }
  }

  if (w.watcher_type === 'sequence') {
    html += '<div class="alert-detail-row"><span class="alert-detail-key">window</span><span class="alert-detail-val">' + (cfg.window || '?') + '</span></div>';
    (cfg.steps || []).forEach(function(s, i) {
      var label = s.label || ('step ' + (i+1));
      var detail = s.source;
      if (s.source === 'logs' && s.filter) {
        var parts = [];
        if (s.filter.service) parts.push(s.filter.service);
        if (s.filter.level) parts.push(s.filter.level);
        if (s.filter.query) parts.push('"' + s.filter.query + '"');
        if (parts.length) detail = parts.join(' ');
      } else if (s.source === 'alert') {
        detail = 'alert from watcher';
      }
      html += '<div class="alert-detail-row"><span class="alert-detail-key">' + (i+1) + '.</span><span class="alert-detail-val">' + escapeHtml(label) + ' <span class="dim">(' + escapeHtml(detail) + ')</span></span></div>';
    });
  }

  return html;
}

function renderWatchers(watchers) {
  var container = document.getElementById('watchers-list');
  if (!allWatchers || allWatchers.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">--</div><p class="empty-state-title">No watchers yet</p><p class="empty-state-desc">Watchers are created by Claude via MCP. Ask Claude to set up monitoring for your databases and logs.</p></div>';
    return;
  }
  if (!watchers || watchers.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">--</div><p class="empty-state-title">No matching watchers</p><p class="empty-state-desc">Try adjusting your filters or <button class="btn btn-sm" onclick="clearWatcherFilters()">clear all</button></p></div>';
    return;
  }

  var html = '';
  watchers.forEach(function(w) {
    var statusClass = w.status === 'active' ? 'status-active' : w.status === 'paused' ? 'status-paused' : 'status-error';
    var statusIcon = w.status === 'active' ? '&#9679;' : w.status === 'paused' ? '&#9208;' : '&#9888;';
    var lastRun = w.last_run_at ? getTimeAgo(w.last_run_at) : 'never';

    html += '<div class="watcher-card" data-id="' + w.id + '">';
    html += '  <div class="watcher-header" onclick="toggleWatcherDetail(\'' + w.id + '\')" style="cursor:pointer">';
    html += '    ' + getWatcherTypeBadge(w);
    html += '    <span class="watcher-title">' + escapeHtml(w.title) + '</span>';
    var schedLabel = w.schedule ? describeSchedule(w.schedule) : ('every ' + (w.time_range || '15m'));
    html += '    <span class="watcher-meta">' + escapeHtml(schedLabel) + '</span>';
    if (w.watcher_type !== 'rule' && w.model) {
      html += '    <span class="watcher-meta">' + escapeHtml(w.model) + '</span>';
    }
    html += '    <span class="watcher-status ' + statusClass + '">' + statusIcon + ' ' + w.status + '</span>';
    html += getAdaptiveBadge(w);
    if (w.human_summary && w.human_summary.what_it_monitors) {
        html += '    <span class="badge claude-managed" title="Created and managed by Claude">claude</span>';
    }
    html += '  </div>';
    html += '  <div class="watcher-info">';
    html += '    <span>Last run: ' + lastRun + '</span>';
    html += '    <span class="severity-badge severity-' + w.severity + '">' + w.severity + '</span>';
    html += '  </div>';
    var typedSummary = getTypedWatcherSummary(w);
    if (typedSummary) {
        html += '  <div class="watcher-typed-summary">' + escapeHtml(typedSummary) + '</div>';
    } else if (w.human_summary && w.human_summary.what_it_monitors) {
        html += '  <div class="watcher-human-summary">' + escapeHtml(w.human_summary.what_it_monitors) + '</div>';
    }

    // Expandable detail section
    html += '  <div class="watcher-detail" id="watcher-detail-' + w.id + '" style="display:none">';
    html += '    <div class="watcher-detail-meta">';
    html += '      <div class="alert-detail-row"><span class="alert-detail-key">id</span><span class="alert-detail-val dim" style="font-size:10px">' + w.id + '</span></div>';
    html += '      <div class="alert-detail-row"><span class="alert-detail-key">type</span><span class="alert-detail-val">' + (w.watcher_type || 'ai') + '</span></div>';
    if (w.description) {
      html += '      <div class="alert-detail-row"><span class="alert-detail-key">description</span><span class="alert-detail-val">' + escapeHtml(w.description) + '</span></div>';
    }
    if (w.watcher_type !== 'rule' && w.model) {
      html += '      <div class="alert-detail-row"><span class="alert-detail-key">model</span><span class="alert-detail-val">' + escapeHtml(w.model) + '</span></div>';
    }
    if (w.watcher_type !== 'rule') {
      html += '      <div class="alert-detail-row"><span class="alert-detail-key">effort</span><span class="alert-detail-val">' + (w.effort || 'medium') + '</span></div>';
    }
    html += '      <div class="alert-detail-row"><span class="alert-detail-key">schedule</span><span class="alert-detail-val">' + escapeHtml(schedLabel) + '</span></div>';
    if (w.time_range) {
      html += '      <div class="alert-detail-row"><span class="alert-detail-key">lookback</span><span class="alert-detail-val">' + escapeHtml(w.time_range) + '</span></div>';
    }
    if (w.created_at) {
      html += '      <div class="alert-detail-row"><span class="alert-detail-key">created</span><span class="alert-detail-val">' + new Date(w.created_at).toLocaleString() + '</span></div>';
    }
    if (w.human_summary) {
      if (w.human_summary.why_it_matters) {
        html += '      <div class="alert-detail-row"><span class="alert-detail-key">why</span><span class="alert-detail-val">' + escapeHtml(w.human_summary.why_it_matters) + '</span></div>';
      }
      if (w.human_summary.what_to_do) {
        html += '      <div class="alert-detail-row"><span class="alert-detail-key">action</span><span class="alert-detail-val">' + escapeHtml(w.human_summary.what_to_do) + '</span></div>';
      }
    }
    if (w.rule_config) {
      if (w.rule_config.source === 'query' && w.rule_config.query) {
        html += '      <div class="alert-detail-row"><span class="alert-detail-key">query</span><span class="alert-detail-val" style="font-size:11px;white-space:pre-wrap">' + escapeHtml(w.rule_config.query) + '</span></div>';
      }
      if (w.rule_config.operator) {
        html += '      <div class="alert-detail-row"><span class="alert-detail-key">condition</span><span class="alert-detail-val">' + (w.rule_config.metric || 'value') + ' ' + w.rule_config.operator + ' ' + (w.rule_config.threshold || 0) + '</span></div>';
      }
    }
    var typedDetail = renderTypedConfigDetail(w);
    if (typedDetail) {
      html += '      <div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">';
      html += '      <div class="alert-detail-row"><span class="alert-detail-key" style="font-weight:600">config</span><span class="alert-detail-val dim" style="font-size:10px">' + w.watcher_type + '</span></div>';
      html += typedDetail;
      html += '      </div>';
    }
    // Effectiveness placeholder — loaded on demand
    html += '      <div id="watcher-eff-' + w.id + '"></div>';
    html += '    </div>';
    html += '  </div>';

    html += '  <div class="watcher-actions">';
    if (isAdmin) {
      html += '    <button class="btn btn-sm" onclick="openEditModal(\'' + w.id + '\')">Edit</button>';
      if (w.status === 'active') {
        html += '    <button class="btn btn-sm" onclick="pauseWatcher(\'' + w.id + '\')">Pause</button>';
      } else if (w.adaptive_state === 'error') {
        html += '    <button class="btn btn-sm btn-resume" onclick="resumeWatcher(\'' + w.id + '\')">Resume Watcher</button>';
      } else {
        html += '    <button class="btn btn-sm" onclick="resumeWatcher(\'' + w.id + '\')">Resume</button>';
      }
      html += '    <button class="btn btn-sm" onclick="runNow(\'' + w.id + '\')">Run Now</button>';
    }
    html += '    <a href="/watchers/' + w.id + '/runs" class="btn btn-sm">History</a>';
    if (isAdmin) {
      html += '    <button class="btn btn-sm btn-danger" onclick="deleteWatcher(\'' + w.id + '\')">Delete</button>';
    }
    html += '  </div>';
    html += '</div>';
  });
  container.innerHTML = html;
}

function loadWatchers() {
  fetch('/api/watchers').then(function(r) { return r.json(); }).then(function(watchers) {
    allWatchers = watchers || [];
    var filtered = filterWatchers();
    updateFilterCount(filtered.length, allWatchers.length);
    renderWatchers(filtered);
  });
}

// --- Simplified Edit Modal ---
function openEditModal(id) {
  fetch('/api/watchers/' + id).then(function(r) { return r.json(); }).then(function(w) {
    document.getElementById('edit-watcher-id').value = w.id;
    document.getElementById('edit-title').value = w.title;
    document.getElementById('edit-description').value = w.description || '';
    document.getElementById('edit-severity').value = w.severity || 'warning';
    document.getElementById('edit-timerange').value = w.time_range || '15m';
    document.getElementById('edit-effort').value = w.effort || 'medium';

    // Show model selector only for AI watchers
    var modelGroup = document.getElementById('edit-model-group');
    if (w.watcher_type !== 'rule') {
      modelGroup.style.display = '';
      loadModelsForEdit(w.model || '');
    } else {
      modelGroup.style.display = 'none';
    }

    document.getElementById('edit-modal').style.display = 'flex';
  });
}

function loadModelsForEdit(currentModel) {
  var sel = document.getElementById('edit-model');
  // Reset to just the default option
  while (sel.options.length > 1) sel.remove(1);
  sel.value = '';

  fetch('/api/models').then(function(r) { return r.json(); }).then(function(models) {
    if (models && models.length) {
      models.forEach(function(m) {
        var opt = document.createElement('option');
        opt.value = m.name;
        opt.textContent = m.model + ' (' + m.name + ')';
        sel.appendChild(opt);
      });
    }
    sel.value = currentModel;
  });
}

function hideEditModal() {
  document.getElementById('edit-modal').style.display = 'none';
}

function saveEditWatcher(e) {
  e.preventDefault();
  var id = document.getElementById('edit-watcher-id').value;
  var btn = document.getElementById('edit-save-btn');
  btn.disabled = true; btn.textContent = 'saving...';

  var body = {
    title: document.getElementById('edit-title').value,
    description: document.getElementById('edit-description').value,
    severity: document.getElementById('edit-severity').value,
    time_range: document.getElementById('edit-timerange').value,
    effort: document.getElementById('edit-effort').value
  };
  // Include model if the model selector is visible (AI watchers only)
  if (document.getElementById('edit-model-group').style.display !== 'none') {
    body.model = document.getElementById('edit-model').value;
  }

  fetch('/api/watchers/' + id, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(function(resp) {
    btn.disabled = false; btn.textContent = 'Save Changes';
    if (!resp.ok) return resp.json().then(function(d) { showToast(d.error || 'Error saving watcher', 'error'); });
    showToast('Watcher updated', 'success');
    hideEditModal();
    loadWatchers();
  }).catch(function() {
    btn.disabled = false; btn.textContent = 'Save Changes';
    showToast('Network error', 'error');
  });
}

// --- Toggle watcher detail ---
function toggleWatcherDetail(id) {
  var el = document.getElementById('watcher-detail-' + id);
  if (!el) return;
  if (el.style.display !== 'none') {
    el.style.display = 'none';
    return;
  }
  el.style.display = 'block';
  // Load effectiveness on first expand
  var effEl = document.getElementById('watcher-eff-' + id);
  if (effEl && !effEl.dataset.loaded) {
    effEl.dataset.loaded = '1';
    effEl.innerHTML = '<span class="dim" style="font-size:11px">loading effectiveness...</span>';
    fetch('/api/watchers/' + id + '/effectiveness?period=7d').then(function(r) { return r.json(); }).then(function(stats) {
      var html = '<div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">';
      html += '<div class="alert-detail-row"><span class="alert-detail-key">signal ratio</span><span class="alert-detail-val">' + (stats.signal_ratio * 100).toFixed(0) + '%</span></div>';
      html += '<div class="alert-detail-row"><span class="alert-detail-key">alerts (7d)</span><span class="alert-detail-val">' + stats.total_alerts + ' total, ' + stats.dismissed_alerts + ' dismissed</span></div>';
      if (stats.false_positives > 0) {
        html += '<div class="alert-detail-row"><span class="alert-detail-key">false pos</span><span class="alert-detail-val" style="color:var(--red)">' + stats.false_positives + ' (' + stats.false_positive_rate.toFixed(0) + '%)</span></div>';
      }
      if (stats.trend && stats.trend !== 'stable') {
        var trendColor = stats.trend === 'improving' ? 'var(--green)' : 'var(--red)';
        html += '<div class="alert-detail-row"><span class="alert-detail-key">trend</span><span class="alert-detail-val" style="color:' + trendColor + '">' + stats.trend + '</span></div>';
      }
      html += '</div>';
      effEl.innerHTML = html;
    }).catch(function() {
      effEl.innerHTML = '';
    });
  }
}
window.toggleWatcherDetail = toggleWatcherDetail;

// --- Watcher lifecycle ---
function pauseWatcher(id) {
  fetch('/api/watchers/' + id + '/pause', { method: 'POST' }).then(function(r) {
    if (r.ok) showToast('Watcher paused', 'info');
    else showToast('Failed to pause watcher', 'error');
    loadWatchers();
  }).catch(function() { showToast('Network error', 'error'); });
}

function resumeWatcher(id) {
  fetch('/api/watchers/' + id + '/resume', { method: 'POST' }).then(function(r) {
    if (r.ok) showToast('Watcher resumed', 'success');
    else showToast('Failed to resume watcher', 'error');
    loadWatchers();
  }).catch(function() { showToast('Network error', 'error'); });
}

function runNow(id) {
  showToast('Watcher run triggered', 'info');
  fetch('/api/watchers/' + id + '/run', { method: 'POST' }).then(function(r) {
    if (!r.ok) showToast('Failed to trigger run', 'error');
    loadWatchers();
  }).catch(function() { showToast('Network error', 'error'); });
}

function deleteWatcher(id) {
  if (!confirm('Delete this watcher?')) return;
  fetch('/api/watchers/' + id, { method: 'DELETE' }).then(function(r) {
    if (r.ok) showToast('Watcher deleted', 'success');
    else showToast('Failed to delete watcher', 'error');
    loadWatchers();
  }).catch(function() { showToast('Network error', 'error'); });
}

// --- Utilities ---
function getTimeAgo(dateStr) {
  if (!dateStr) return 'never';
  var now = new Date();
  var date = new Date(dateStr);
  var diff = Math.floor((now - date) / 1000);
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// Schedule preview (client-side description)
function describeSchedule(expr) {
  if (!expr) return '';
  expr = expr.trim();
  var predefined = {'@hourly':'Every hour','@daily':'Daily at midnight','@weekly':'Once a week','@monthly':'Once a month','@yearly':'Once a year'};
  if (predefined[expr.toLowerCase()]) return predefined[expr.toLowerCase()];
  if (/^\@every /.test(expr)) return 'Every ' + expr.slice(7);
  var m = expr.match(/^(\d+)(s|m|h)$/);
  if (m) {
    var n = parseInt(m[1]); var u = m[2];
    if (u === 's') return n === 1 ? 'Every second' : 'Every ' + n + ' seconds';
    if (u === 'm') return n === 1 ? 'Every minute' : 'Every ' + n + ' minutes';
    if (u === 'h') return n === 1 ? 'Every hour' : 'Every ' + n + ' hours';
  }
  var parts = expr.split(/\s+/);
  if (parts.length !== 5) return '';
  var min=parts[0], hr=parts[1], dom=parts[2], mon=parts[3], dow=parts[4];
  function fmtTime(h,m) {
    h=parseInt(h); m=parseInt(m); var ap='AM', dh=h;
    if(h===0){dh=12;}else if(h===12){ap='PM';}else if(h>12){dh=h-12;ap='PM';}
    return dh+':'+(m<10?'0':'')+m+' '+ap;
  }
  if(min.indexOf('*/')===0 && hr==='*' && dom==='*' && dow==='*') return 'Every '+min.slice(2)+' minutes';
  if(min==='0' && hr.indexOf('*/')===0 && dom==='*' && dow==='*') return 'Every '+hr.slice(2)+' hours';
  if(dom==='*' && dow==='*' && min.indexOf('*')<0 && hr.indexOf('*')<0) return 'Daily at '+fmtTime(hr,min);
  if(dom==='*' && dow==='1-5' && min.indexOf('*')<0 && hr.indexOf('*')<0) return 'Weekdays at '+fmtTime(hr,min);
  if(dom==='*' && (dow==='0,6'||dow==='6,0') && min.indexOf('*')<0 && hr.indexOf('*')<0) return 'Weekends at '+fmtTime(hr,min);
  return 'Custom cron schedule';
}

initFromUrl();
loadWatchers();
window.loadPageData = loadWatchers;
