{{define "content"}}
<div class="page-header">
  <h1><span class="prompt">$</span> overview</h1>
</div>

<div class="stat-grid" id="stat-grid">
  <a href="/alerts" class="stat-card" id="stat-alerts">
    <div class="stat-number" id="stat-alerts-num">—</div>
    <div class="stat-label">alerts</div>
    <div class="stat-detail" id="stat-alerts-detail">loading...</div>
  </a>
  <a href="/watchers" class="stat-card" id="stat-watchers">
    <div class="stat-number" id="stat-watchers-num">—</div>
    <div class="stat-label">watchers</div>
    <div class="stat-detail" id="stat-watchers-detail">loading...</div>
  </a>
  <a href="/logs" class="stat-card" id="stat-logs">
    <div class="stat-number" id="stat-logs-num">—</div>
    <div class="stat-label">logs / 1h</div>
    <div class="stat-detail" id="stat-logs-detail">loading...</div>
  </a>
  <a href="/connectors" class="stat-card" id="stat-connectors">
    <div class="stat-number" id="stat-connectors-num">—</div>
    <div class="stat-label">connectors</div>
    <div class="stat-detail" id="stat-connectors-detail">loading...</div>
  </a>
  <a href="/servers" class="stat-card" id="stat-servers">
    <div class="stat-number" id="stat-servers-num">—</div>
    <div class="stat-label">servers</div>
    <div class="stat-detail" id="stat-servers-detail">loading...</div>
  </a>
</div>

<div class="overview-panels">
  <div class="overview-panel" id="digest-panel">
    <div class="overview-panel-header">
      <span>health digest</span>
      <a href="/digests" class="panel-link">history &rarr;</a>
    </div>
    <div class="overview-panel-body" id="digest-summary">
      <div class="loading-state">loading digest</div>
    </div>
  </div>
  <div class="overview-panel">
    <div class="overview-panel-header">
      <span>recent alerts</span>
      <a href="/alerts" class="panel-link">view all &rarr;</a>
    </div>
    <div class="overview-panel-body" id="recent-alerts">
      <div class="loading-state">loading alerts</div>
    </div>
  </div>
</div>

<script nonce="{{.CSPNonce}}">
(function(){
  function loadStats() {
    fetch('/api/overview' + (getGlobalEnv() ? '?env=' + encodeURIComponent(getGlobalEnv()) : '')).then(function(r){ return r.json(); }).then(function(d){
      // Alerts
      var an = document.getElementById('stat-alerts-num');
      var ad = document.getElementById('stat-alerts-detail');
      an.textContent = d.alerts.total;
      an.className = 'stat-number' + (d.alerts.critical > 0 ? ' status-error' : d.alerts.total > 0 ? ' status-warn' : ' status-ok');
      var parts = [];
      if (d.alerts.critical > 0) parts.push(d.alerts.critical + ' critical');
      if (d.alerts.warning > 0) parts.push(d.alerts.warning + ' warning');
      if (d.alerts.info > 0) parts.push(d.alerts.info + ' info');
      ad.textContent = parts.length > 0 ? parts.join(', ') : 'all clear';

      // Watchers
      var wn = document.getElementById('stat-watchers-num');
      var wd = document.getElementById('stat-watchers-detail');
      wn.textContent = d.watchers.total;
      wn.className = 'stat-number' + (d.watchers.error > 0 ? ' status-error' : d.watchers.active > 0 ? ' status-ok' : '');
      var wParts = [];
      if (d.watchers.active > 0) wParts.push(d.watchers.active + ' active');
      if (d.watchers.paused > 0) wParts.push(d.watchers.paused + ' paused');
      if (d.watchers.error > 0) wParts.push(d.watchers.error + ' error');
      wd.textContent = wParts.length > 0 ? wParts.join(', ') : 'none configured';

      // Logs
      var ln = document.getElementById('stat-logs-num');
      var ld = document.getElementById('stat-logs-detail');
      ln.textContent = d.logs.last_hour;
      ln.className = 'stat-number' + (d.logs.errors_last_hour > 0 ? ' status-warn' : '');
      ld.textContent = d.logs.errors_last_hour > 0 ? d.logs.errors_last_hour + ' errors' : 'no errors';

      // Connectors
      var cn = document.getElementById('stat-connectors-num');
      var cd = document.getElementById('stat-connectors-detail');
      cn.textContent = d.connectors.connected + ' / ' + d.connectors.total;
      cn.className = 'stat-number' + (d.connectors.error > 0 ? ' status-error' : d.connectors.connected === d.connectors.total && d.connectors.total > 0 ? ' status-ok' : '');
      cd.textContent = d.connectors.error > 0 ? d.connectors.error + ' error' : d.connectors.total > 0 ? 'all connected' : 'none configured';

      // Servers
      if (d.servers) {
        var sn = document.getElementById('stat-servers-num');
        var sd = document.getElementById('stat-servers-detail');
        sn.textContent = d.servers.total;
        sn.className = 'stat-number' + (d.servers.offline > 0 ? ' status-warn' : d.servers.online > 0 ? ' status-ok' : '');
        sd.textContent = d.servers.online > 0 ? d.servers.online + ' online' : 'none monitored';
        if (d.servers.offline > 0) sd.textContent += ', ' + d.servers.offline + ' offline';
      }
    }).catch(function(){});
  }

  function loadRecentAlerts() {
    fetch('/api/alerts?limit=5' + (getGlobalEnv() ? '&env=' + encodeURIComponent(getGlobalEnv()) : '')).then(function(r){ return r.json(); }).then(function(alerts){
      var container = document.getElementById('recent-alerts');
      if (!alerts || alerts.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">--</div><p class="empty-state-title">no recent alerts</p><p class="empty-state-desc">Alerts from your watchers will appear here when issues are detected.</p></div>';
        return;
      }
      var html = '';
      alerts.forEach(function(a){
        var sevIcon = a.severity === 'critical' ? '!!' : a.severity === 'warning' ? '!' : 'i';
        var timeAgo = getTimeAgo(a.created_at);
        html += '<div class="overview-alert severity-' + a.severity + '">';
        html += '  <span class="severity-badge severity-' + a.severity + '">' + sevIcon + '</span>';
        html += '  <span class="overview-alert-title">' + escapeHtml(a.title) + '</span>';
        html += '  <span class="overview-alert-time">' + timeAgo + '</span>';
        html += '</div>';
      });
      container.innerHTML = html;
    }).catch(function(){
      document.getElementById('recent-alerts').innerHTML = '<div class="empty-state"><div class="empty-icon">--</div><p class="empty-state-title">could not load alerts</p><p class="empty-state-desc">Check your connection and try refreshing.</p></div>';
    });
  }

  function getTimeAgo(dateStr) {
    var now = new Date();
    var date = new Date(dateStr);
    var diff = Math.floor((now - date) / 1000);
    if (diff < 60) return diff + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function loadDigestSummary() {
    fetch('/api/digests/latest' + (getGlobalEnv() ? '?env=' + encodeURIComponent(getGlobalEnv()) : '')).then(function(r){ return r.json(); }).then(function(d){
      var container = document.getElementById('digest-summary');
      if (!d || d.status === 'empty' || d.status === 'unavailable') {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">--</div><p class="empty-state-title">no digest yet</p><p class="empty-state-desc">Health digests are generated periodically from your watcher results.</p></div>';
        return;
      }
      var sc = d.status === 'critical' || d.status === 'degraded' ? 'status-error' : d.status === 'needs_attention' ? 'status-warn' : d.status === 'healthy' ? 'status-ok' : '';
      var icon = d.status === 'critical' ? '!!' : d.status === 'degraded' ? '!~' : d.status === 'needs_attention' ? '!' : d.status === 'healthy' ? 'ok' : 'i';
      var html = '<div class="digest-summary-row">';
      html += '<span class="severity-badge ' + sc + '">' + icon + '</span>';
      html += '<strong>' + d.status + '</strong>';
      html += '<span class="dim">|</span>';
      html += '<span>' + d.alert_total + ' alerts (' + d.alert_critical + ' critical)</span>';
      html += '<span class="dim">|</span>';
      html += '<span>' + d.watcher_total + ' watchers (' + d.watcher_errored + ' errors)</span>';
      html += '<span class="dim">|</span>';
      html += '<span>' + d.failed_runs + ' failed runs</span>';
      html += '</div>';
      container.innerHTML = html;
    }).catch(function(){
      document.getElementById('digest-summary').innerHTML = '<div class="empty-state"><div class="empty-icon">--</div><p class="empty-state-title">digest unavailable</p><p class="empty-state-desc">Check your connection and try refreshing.</p></div>';
    });
  }

  loadStats();
  loadRecentAlerts();
  loadDigestSummary();
  setInterval(function(){ loadStats(); loadRecentAlerts(); loadDigestSummary(); }, 30000);

  window.loadPageData = function() { loadStats(); loadRecentAlerts(); loadDigestSummary(); };
})();
</script>
{{end}}
