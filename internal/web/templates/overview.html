{{define "content"}}
<div class="page-header">
  <h1><span class="prompt">$</span> overview</h1>
</div>

<div class="stat-grid" id="stat-grid">
  <a href="/alerts" class="stat-card" id="stat-alerts">
    <div class="stat-number" id="stat-alerts-num">—</div>
    <div class="stat-label">alerts</div>
    <div class="stat-detail" id="stat-alerts-detail">loading...</div>
  </a>
  <a href="/watchers" class="stat-card" id="stat-watchers">
    <div class="stat-number" id="stat-watchers-num">—</div>
    <div class="stat-label">watchers</div>
    <div class="stat-detail" id="stat-watchers-detail">loading...</div>
  </a>
  <a href="/logs" class="stat-card" id="stat-logs">
    <div class="stat-number" id="stat-logs-num">—</div>
    <div class="stat-label">logs / 1h</div>
    <div class="stat-detail" id="stat-logs-detail">loading...</div>
  </a>
  <a href="/connectors" class="stat-card" id="stat-connectors">
    <div class="stat-number" id="stat-connectors-num">—</div>
    <div class="stat-label">connectors</div>
    <div class="stat-detail" id="stat-connectors-detail">loading...</div>
  </a>
  <a href="/servers" class="stat-card" id="stat-servers">
    <div class="stat-number" id="stat-servers-num">—</div>
    <div class="stat-label">servers</div>
    <div class="stat-detail" id="stat-servers-detail">loading...</div>
  </a>
</div>

<div class="overview-panels">
  <!-- Left: Triage inbox -->
  <div class="overview-panel">
    <div class="overview-panel-header">
      <span>needs attention</span>
      <a href="/alerts" class="panel-link">view all &rarr;</a>
    </div>
    <div class="overview-panel-body" id="triage-items">
      <div class="loading-state">loading</div>
    </div>
  </div>

  <!-- Right: MCP activity -->
  <div class="overview-panel">
    <div class="overview-panel-header">
      <span>mcp activity</span>
    </div>
    <div class="overview-panel-body" id="mcp-activity">
      <div class="loading-state">loading</div>
    </div>
  </div>
</div>

<script nonce="{{.CSPNonce}}">
(function(){
  function loadStats() {
    fetch('/api/overview' + (getGlobalEnv() ? '?env=' + encodeURIComponent(getGlobalEnv()) : '')).then(function(r){ return r.json(); }).then(function(d){
      // Alerts
      var an = document.getElementById('stat-alerts-num');
      var ad = document.getElementById('stat-alerts-detail');
      an.textContent = d.alerts.total;
      an.className = 'stat-number' + (d.alerts.critical > 0 ? ' status-error' : d.alerts.total > 0 ? ' status-warn' : ' status-ok');
      var parts = [];
      if (d.alerts.critical > 0) parts.push(d.alerts.critical + ' critical');
      if (d.alerts.warning > 0) parts.push(d.alerts.warning + ' warning');
      if (d.alerts.info > 0) parts.push(d.alerts.info + ' info');
      ad.textContent = parts.length > 0 ? parts.join(', ') : 'all clear';

      // Watchers
      var wn = document.getElementById('stat-watchers-num');
      var wd = document.getElementById('stat-watchers-detail');
      wn.textContent = d.watchers.total;
      wn.className = 'stat-number' + (d.watchers.error > 0 ? ' status-error' : d.watchers.active > 0 ? ' status-ok' : '');
      var wParts = [];
      if (d.watchers.active > 0) wParts.push(d.watchers.active + ' active');
      if (d.watchers.paused > 0) wParts.push(d.watchers.paused + ' paused');
      if (d.watchers.error > 0) wParts.push(d.watchers.error + ' error');
      wd.textContent = wParts.length > 0 ? wParts.join(', ') : 'none configured';

      // Logs
      var ln = document.getElementById('stat-logs-num');
      var ld = document.getElementById('stat-logs-detail');
      ln.textContent = d.logs.last_hour;
      ln.className = 'stat-number' + (d.logs.errors_last_hour > 0 ? ' status-warn' : '');
      ld.textContent = d.logs.errors_last_hour > 0 ? d.logs.errors_last_hour + ' errors' : 'no errors';

      // Connectors
      var cn = document.getElementById('stat-connectors-num');
      var cd = document.getElementById('stat-connectors-detail');
      cn.textContent = d.connectors.connected + ' / ' + d.connectors.total;
      cn.className = 'stat-number' + (d.connectors.error > 0 ? ' status-error' : d.connectors.connected === d.connectors.total && d.connectors.total > 0 ? ' status-ok' : '');
      cd.textContent = d.connectors.error > 0 ? d.connectors.error + ' error' : d.connectors.total > 0 ? 'all connected' : 'none configured';

      // Servers
      if (d.servers) {
        var sn = document.getElementById('stat-servers-num');
        var sd = document.getElementById('stat-servers-detail');
        sn.textContent = d.servers.total;
        sn.className = 'stat-number' + (d.servers.offline > 0 ? ' status-warn' : d.servers.online > 0 ? ' status-ok' : '');
        sd.textContent = d.servers.online > 0 ? d.servers.online + ' online' : 'none monitored';
        if (d.servers.offline > 0) sd.textContent += ', ' + d.servers.offline + ' offline';
      }
    }).catch(function(){});
  }

  function loadTriage() {
    var url = '/api/overview/triage';
    if (getGlobalEnv()) url += '?env=' + encodeURIComponent(getGlobalEnv());
    fetch(url).then(function(r){ return r.json(); }).then(function(data){
      var container = document.getElementById('triage-items');
      var items = data.needs_attention || [];
      if (items.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">--</div><p class="empty-state-title">all clear</p><p class="empty-state-desc">No issues need your attention right now.</p></div>';
        return;
      }
      var html = '';
      items.forEach(function(item){
        var icon = item.type === 'alert' ? (item.severity === 'critical' ? '!!' : '!') : item.type === 'run' ? '!' : item.type === 'connector' ? '!' : 'i';
        var sevClass = item.severity === 'critical' ? 'severity-critical' : item.severity === 'warning' ? 'severity-warning' : 'severity-info';
        html += '<div class="triage-item ' + sevClass + '">';
        html += '  <span class="triage-type-badge">' + escapeHtml(icon) + '</span>';
        html += '  <span class="triage-type">' + escapeHtml(item.type) + '</span>';
        html += '  <span class="triage-title">' + escapeHtml(item.title) + '</span>';
        html += '  <span class="triage-detail">' + escapeHtml(item.detail || '') + '</span>';
        html += '  <span class="triage-time">' + getTimeAgo(item.time) + '</span>';
        html += '</div>';
      });
      container.innerHTML = html;
    }).catch(function(){
      document.getElementById('triage-items').innerHTML = '<div class="empty-state"><div class="empty-icon">--</div><p class="empty-state-title">could not load triage</p></div>';
    });
  }

  function loadMCPActivity() {
    var container = document.getElementById('mcp-activity');
    // Load stats first
    fetch('/api/mcp/activity/stats').then(function(r){ return r.json(); }).then(function(stats){
      var html = '<div class="mcp-stats">';
      html += '<div class="mcp-stat-row"><span class="mcp-stat-key">connections</span><span class="mcp-stat-val">' + (stats.active_sessions || 0) + ' active</span></div>';
      html += '<div class="mcp-stat-row"><span class="mcp-stat-key">calls / 1h</span><span class="mcp-stat-val">' + (stats.calls_last_hour || 0);
      if (stats.errors_last_hour > 0) html += ' <span class="status-error">(' + stats.errors_last_hour + ' errors)</span>';
      html += '</span></div>';
      html += '<div class="mcp-stat-row"><span class="mcp-stat-key">last</span><span class="mcp-stat-val">' + (stats.last_activity ? getTimeAgo(stats.last_activity) : 'never') + '</span></div>';
      html += '</div>';

      // Load recent calls
      fetch('/api/mcp/activity?limit=8').then(function(r2){ return r2.json(); }).then(function(events){
        if (events && events.length > 0) {
          html += '<div class="mcp-recent-header">recent calls</div>';
          events.forEach(function(ev){
            var cls = ev.is_error ? ' mcp-event-error' : '';
            html += '<div class="mcp-event' + cls + '">';
            html += '  <span class="mcp-event-tool">' + escapeHtml(ev.tool_name) + '</span>';
            html += '  <span class="mcp-event-time">' + getTimeAgo(ev.created_at) + '</span>';
            if (ev.duration_ms) html += '  <span class="mcp-event-dur">' + ev.duration_ms + 'ms</span>';
            html += '</div>';
          });
        }
        container.innerHTML = html;
      }).catch(function(){
        container.innerHTML = html;
      });
    }).catch(function(){
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">--</div><p class="empty-state-title">no mcp data</p><p class="empty-state-desc">MCP activity will appear here when Claude Code connects.</p></div>';
    });
  }

  function getTimeAgo(dateStr) {
    if (!dateStr) return 'never';
    var now = new Date();
    var date = new Date(dateStr);
    var diff = Math.floor((now - date) / 1000);
    if (diff < 60) return diff + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  loadStats();
  loadTriage();
  loadMCPActivity();
  setInterval(function(){ loadStats(); loadTriage(); loadMCPActivity(); }, 30000);

  window.loadPageData = function() { loadStats(); loadTriage(); loadMCPActivity(); };
})();
</script>
{{end}}
