{{define "content"}}
<h1><span class="prompt-prefix">$</span> investigate</h1>

<form id="query-form" class="query-form" onsubmit="startInvestigation(event)">
  <span class="prompt-prefix" style="line-height:34px;">>&nbsp;</span>
  <input type="text" name="query" id="query-input" placeholder="describe the issue to investigate..." autofocus autocomplete="off">
  <button type="submit" class="btn btn-primary" id="submit-btn">run</button>
</form>

<div id="trace-output"></div>
<div id="status-bar" class="text-xs text-dim mt-16"></div>

<script>
function startInvestigation(e) {
  e.preventDefault();
  var query = document.getElementById('query-input').value.trim();
  if (!query) return;

  var output = document.getElementById('trace-output');
  var btn = document.getElementById('submit-btn');
  var input = document.getElementById('query-input');
  var status = document.getElementById('status-bar');

  output.innerHTML = '';
  status.textContent = 'connecting...';
  btn.disabled = true;
  btn.textContent = 'running';
  btn.classList.add('spinner');
  input.disabled = true;

  var es = new EventSource('/api/investigate?query=' + encodeURIComponent(query));
  var stepCount = 0;

  es.onmessage = function(event) {
    var data = JSON.parse(event.data);
    stepCount++;
    var step = document.createElement('div');
    step.className = 'trace-step ' + data.step_type;

    var label = data.step_type;
    if (data.tool_name) label += ' → ' + data.tool_name;

    step.innerHTML = '<div class="step-label">' + escapeHtml(label) + '</div><pre>' + escapeHtml(data.content) + '</pre>';
    output.appendChild(step);
    step.scrollIntoView({behavior: 'smooth', block: 'end'});

    if (data.step_type === 'final' || data.step_type === 'error') {
      status.textContent = 'done (' + stepCount + ' steps)';
    } else {
      status.textContent = 'step ' + stepCount + '...';
    }
  };

  es.onerror = function() {
    es.close();
    btn.disabled = false;
    btn.textContent = 'run';
    btn.classList.remove('spinner');
    input.disabled = false;
    if (stepCount === 0) {
      status.textContent = 'connection failed';
    }
  };
}

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>
{{end}}
