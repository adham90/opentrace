{{define "content"}}
<div class="chat-layout">
  <!-- Left Panel: Chat Sidebar -->
  <div class="chat-sidebar">
    <div class="chat-sidebar-header">
      <button class="btn btn-primary" onclick="newChat()">+ new chat</button>
    </div>
    <div class="chat-list" id="chat-list"></div>
  </div>

  <!-- Right Panel: Conversation -->
  <div class="chat-main">
    <div class="message-area" id="message-area">
      <div class="empty-state" id="empty-state">
        <span class="prompt-prefix">$</span>&nbsp; start a new investigation
      </div>
    </div>

    <div class="chat-input-area">
      <form class="query-form" onsubmit="startInvestigation(event)">
        <span class="prompt-prefix" style="line-height:34px;">>&nbsp;</span>
        <input type="text" id="query-input" placeholder="describe the issue to investigate..." autofocus autocomplete="off">
        <select id="provider-select" title="LLM provider" style="background:#1a1a2e;color:#e0e0e0;border:1px solid #333;border-radius:4px;padding:4px 8px;font-size:12px;font-family:inherit;margin-right:4px;"></select>
        <button type="submit" class="btn btn-primary" id="submit-btn">run</button>
      </form>
      <div id="status-bar" class="text-xs text-dim"></div>
    </div>
  </div>
</div>

<script>
var currentChatId = null;
var eventSource = null;

// --- Sidebar ---

function loadChatList() {
  fetch('/api/chats')
    .then(function(r) { return r.json(); })
    .then(function(chats) {
      var list = document.getElementById('chat-list');
      if (!chats || chats.length === 0) {
        list.innerHTML = '<div class="empty" style="padding:16px;">no chats yet</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < chats.length; i++) {
        var c = chats[i];
        var isActive = currentChatId === c.id;
        html += '<div class="chat-list-item' + (isActive ? ' active' : '') + '" onclick="selectChat(\'' + c.id + '\')">';
        html += '<div class="chat-info">';
        html += '<div class="chat-title">' + escapeHtml(c.title || 'Untitled') + '</div>';
        html += '<div class="chat-time">' + relativeTime(c.updated_at) + '</div>';
        html += '</div>';
        html += '<button class="chat-delete" onclick="event.stopPropagation();deleteChat(\'' + c.id + '\')" title="delete">&times;</button>';
        html += '</div>';
      }
      list.innerHTML = html;
    })
    .catch(function() {});
}

function selectChat(id) {
  currentChatId = id;
  loadChatList();
  fetch('/api/chats/' + id)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      renderMessages(data.messages || []);
    })
    .catch(function() {
      showEmptyState();
    });
}

function newChat() {
  currentChatId = null;
  loadChatList();
  showEmptyState();
  document.getElementById('query-input').focus();
}

function deleteChat(id) {
  fetch('/api/chats/' + id, { method: 'DELETE' })
    .then(function() {
      if (currentChatId === id) {
        currentChatId = null;
        showEmptyState();
      }
      loadChatList();
    })
    .catch(function() {});
}

function showEmptyState() {
  var area = document.getElementById('message-area');
  area.innerHTML = '<div class="empty-state" id="empty-state"><span class="prompt-prefix">$</span>&nbsp; start a new investigation</div>';
}

// --- Messages ---

function renderMessages(messages) {
  var area = document.getElementById('message-area');
  area.innerHTML = '';

  if (!messages || messages.length === 0) {
    showEmptyState();
    return;
  }

  // Group trace steps (tool_call, observation, thinking) between user and assistant messages
  var i = 0;
  while (i < messages.length) {
    var msg = messages[i];

    if (msg.role === 'user') {
      area.appendChild(createUserBubble(msg.content));
      i++;
    } else if (msg.role === 'assistant') {
      area.appendChild(createAssistantBubble(msg.content));
      i++;
    } else {
      // Collect consecutive trace steps
      var traceSteps = [];
      while (i < messages.length && (messages[i].role === 'tool_call' || messages[i].role === 'observation' || messages[i].role === 'thinking')) {
        traceSteps.push(messages[i]);
        i++;
      }
      if (traceSteps.length > 0) {
        area.appendChild(createTraceBlock(traceSteps));
      }
    }
  }

  scrollToBottom();
}

function createUserBubble(content) {
  var div = document.createElement('div');
  div.className = 'message message-user';
  div.innerHTML = '<div class="message-role">you</div><div class="message-content"><pre>' + escapeHtml(content) + '</pre></div>';
  return div;
}

function createAssistantBubble(content) {
  var div = document.createElement('div');
  div.className = 'message message-assistant';
  div.innerHTML = '<div class="message-role">assistant</div><div class="message-content"><pre>' + escapeHtml(content) + '</pre></div>';
  return div;
}

function createTraceBlock(steps) {
  var details = document.createElement('details');
  details.className = 'message-trace';

  var toolNames = [];
  for (var i = 0; i < steps.length; i++) {
    if (steps[i].tool_name && toolNames.indexOf(steps[i].tool_name) === -1) {
      toolNames.push(steps[i].tool_name);
    }
  }

  var summary = document.createElement('summary');
  var label = steps.length + ' trace step' + (steps.length !== 1 ? 's' : '');
  if (toolNames.length > 0) {
    label += ' (' + toolNames.join(', ') + ')';
  }
  summary.textContent = label;
  details.appendChild(summary);

  var container = document.createElement('div');
  container.className = 'trace-steps';
  for (var j = 0; j < steps.length; j++) {
    var step = steps[j];
    var stepDiv = document.createElement('div');
    stepDiv.className = 'trace-step ' + step.role;

    var stepLabel = step.role;
    if (step.tool_name) stepLabel += ' \u2192 ' + step.tool_name;

    stepDiv.innerHTML = '<div class="step-label">' + escapeHtml(stepLabel) + '</div><pre>' + escapeHtml(step.content) + '</pre>';
    container.appendChild(stepDiv);
  }
  details.appendChild(container);
  return details;
}

function createStreamingTraceBlock() {
  var details = document.createElement('details');
  details.className = 'message-trace';
  details.setAttribute('open', '');
  details.setAttribute('data-streaming', 'true');

  var summary = document.createElement('summary');
  summary.textContent = 'trace steps...';
  details.appendChild(summary);

  var container = document.createElement('div');
  container.className = 'trace-steps';
  details.appendChild(container);

  return details;
}

function addStepToStreamingTrace(traceBlock, stepType, content, toolName) {
  var container = traceBlock.querySelector('.trace-steps');
  var stepDiv = document.createElement('div');
  stepDiv.className = 'trace-step ' + stepType;

  var label = stepType;
  if (toolName) label += ' \u2192 ' + toolName;

  stepDiv.innerHTML = '<div class="step-label">' + escapeHtml(label) + '</div><pre>' + escapeHtml(content) + '</pre>';
  container.appendChild(stepDiv);

  // Update summary count
  var steps = container.querySelectorAll('.trace-step');
  var summary = traceBlock.querySelector('summary');
  summary.textContent = steps.length + ' trace step' + (steps.length !== 1 ? 's' : '') + '...';
}

function finalizeStreamingTrace(traceBlock) {
  traceBlock.removeAttribute('data-streaming');
  traceBlock.removeAttribute('open');

  var steps = traceBlock.querySelectorAll('.trace-step');
  var summary = traceBlock.querySelector('summary');

  // Collect tool names
  var toolNames = [];
  for (var i = 0; i < steps.length; i++) {
    var labelEl = steps[i].querySelector('.step-label');
    if (labelEl) {
      var text = labelEl.textContent;
      var arrowIdx = text.indexOf('\u2192');
      if (arrowIdx !== -1) {
        var name = text.substring(arrowIdx + 2).trim();
        if (toolNames.indexOf(name) === -1) toolNames.push(name);
      }
    }
  }

  var label = steps.length + ' trace step' + (steps.length !== 1 ? 's' : '');
  if (toolNames.length > 0) {
    label += ' (' + toolNames.join(', ') + ')';
  }
  summary.textContent = label;
}

// --- Investigation SSE ---

function startInvestigation(e) {
  e.preventDefault();
  var query = document.getElementById('query-input').value.trim();
  if (!query) return;

  var btn = document.getElementById('submit-btn');
  var input = document.getElementById('query-input');
  var status = document.getElementById('status-bar');
  var area = document.getElementById('message-area');

  // Clear empty state
  var emptyEl = document.getElementById('empty-state');
  if (emptyEl) emptyEl.remove();

  // Show user message immediately
  area.appendChild(createUserBubble(query));
  scrollToBottom();

  // Disable input
  status.textContent = 'connecting...';
  btn.disabled = true;
  btn.textContent = 'running';
  btn.classList.add('spinner');
  input.disabled = true;
  input.value = '';

  // Build URL
  var url = '/api/investigate?query=' + encodeURIComponent(query);
  if (currentChatId) {
    url += '&chat_id=' + encodeURIComponent(currentChatId);
  }
  var providerSelect = document.getElementById('provider-select');
  if (providerSelect && providerSelect.value) {
    url += '&provider=' + encodeURIComponent(providerSelect.value);
  }

  // Streaming state
  var stepCount = 0;
  var currentTraceBlock = null;

  if (eventSource) {
    eventSource.close();
  }
  eventSource = new EventSource(url);

  eventSource.onmessage = function(event) {
    var data = JSON.parse(event.data);

    // Handle chat_id event
    if (data.step_type === 'chat_id') {
      currentChatId = data.content;
      loadChatList();
      return;
    }

    stepCount++;

    if (data.step_type === 'final' || data.step_type === 'error') {
      // Finalize any open trace block
      if (currentTraceBlock) {
        finalizeStreamingTrace(currentTraceBlock);
        currentTraceBlock = null;
      }

      // Show final/error as assistant message
      area.appendChild(createAssistantBubble(data.content));
      status.textContent = 'done (' + stepCount + ' steps)';
    } else {
      // It's a trace step (thinking, tool_call, observation)
      if (!currentTraceBlock) {
        currentTraceBlock = createStreamingTraceBlock();
        area.appendChild(currentTraceBlock);
      }
      addStepToStreamingTrace(currentTraceBlock, data.step_type, data.content, data.tool_name);
      status.textContent = 'step ' + stepCount + '...';
    }

    scrollToBottom();
  };

  eventSource.onerror = function() {
    eventSource.close();
    eventSource = null;

    btn.disabled = false;
    btn.textContent = 'run';
    btn.classList.remove('spinner');
    input.disabled = false;

    // Finalize any open trace block
    if (currentTraceBlock) {
      finalizeStreamingTrace(currentTraceBlock);
      currentTraceBlock = null;
    }

    if (stepCount === 0) {
      status.textContent = 'connection failed';
    }

    loadChatList();
  };
}

// --- Helpers ---

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function scrollToBottom() {
  var area = document.getElementById('message-area');
  area.scrollTop = area.scrollHeight;
}

function relativeTime(dateStr) {
  if (!dateStr) return '';
  var now = new Date();
  var then = new Date(dateStr);
  var diffMs = now - then;
  var diffSec = Math.floor(diffMs / 1000);
  var diffMin = Math.floor(diffSec / 60);
  var diffHr = Math.floor(diffMin / 60);
  var diffDay = Math.floor(diffHr / 24);

  if (diffSec < 60) return 'just now';
  if (diffMin < 60) return diffMin + 'm ago';
  if (diffHr < 24) return diffHr + 'h ago';
  if (diffDay < 7) return diffDay + 'd ago';
  return then.toLocaleDateString();
}

// --- Providers ---

function loadProviders() {
  fetch('/api/providers')
    .then(function(r) { return r.json(); })
    .then(function(providers) {
      var sel = document.getElementById('provider-select');
      sel.innerHTML = '';
      if (!providers || providers.length === 0) return;
      for (var i = 0; i < providers.length; i++) {
        var opt = document.createElement('option');
        opt.value = providers[i].name;
        opt.textContent = providers[i].name + ' (' + providers[i].model + ')';
        sel.appendChild(opt);
      }
    })
    .catch(function() {});
}

// --- Init ---
loadChatList();
loadProviders();
</script>
{{end}}
