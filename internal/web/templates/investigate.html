{{define "content"}}
<!-- Floating expand button (visible when sidebar collapsed) -->
<button class="sidebar-expand" id="sidebar-expand-btn" onclick="toggleSidebar()" title="expand sidebar">]</button>

<div class="chat-layout">
  <!-- Left Panel: Sidebar with nav + chat list -->
  <div class="chat-sidebar" id="chat-sidebar">
    <!-- Brand + collapse toggle -->
    <div class="sidebar-brand">
      <span class="logo">OPENTRACE</span>
      <button class="sidebar-toggle" onclick="toggleSidebar()" title="collapse sidebar">[</button>
    </div>

    <!-- Navigation tabs -->
    <nav class="sidebar-nav">
      <a href="/" class="sidebar-nav-item active">
        <span class="nav-icon">&#9656;</span> investigate
      </a>
      <a href="/logs" class="sidebar-nav-item">
        <span class="nav-icon">&#9776;</span> logs
      </a>
      <a href="/connectors" class="sidebar-nav-item">
        <span class="nav-icon">&#9881;</span> connectors
      </a>
    </nav>

    <!-- New chat button -->
    <div class="chat-sidebar-header">
      <button class="btn-new-chat" onclick="newChat()">+ new chat</button>
    </div>

    <!-- Chat history list -->
    <div class="chat-list" id="chat-list"></div>
  </div>

  <!-- Right Panel: Conversation -->
  <div class="chat-main">
    <div class="message-area" id="message-area">
      <div class="message-area-inner" id="message-area-inner">
        <div class="empty-state" id="empty-state">
          <div class="empty-state-prompt">$_</div>
          <div class="empty-state-text">start a new investigation</div>
          <div class="empty-state-hint">describe an issue, ask a question, or paste an error</div>
        </div>
      </div>
    </div>

    <div id="plan-sticky-wrapper"></div>

    <div class="chat-input-area">
      <div class="chat-input-inner">
        <form class="query-form" onsubmit="startInvestigation(event)">
          <span class="prompt-prefix">&gt;&nbsp;</span>
          <input type="text" id="query-input" placeholder="describe the issue to investigate..." autofocus autocomplete="off">
          <select id="provider-select" title="LLM provider"></select>
          <button type="submit" class="btn-submit" id="submit-btn">run</button>
        </form>
        <div id="status-bar"></div>
      </div>
    </div>
  </div>
</div>

<script>
var currentChatId = {{if .ChatID}}"{{.ChatID}}"{{else}}null{{end}};
var eventSource = null;
var activePlanPanel = null;   // currently active plan panel element
var planIsSticky = false;     // whether plan is in sticky wrapper

// --- Sidebar ---

function toggleSidebar() {
  var sidebar = document.getElementById('chat-sidebar');
  var expandBtn = document.getElementById('sidebar-expand-btn');
  sidebar.classList.toggle('collapsed');
  var isCollapsed = sidebar.classList.contains('collapsed');
  expandBtn.style.display = isCollapsed ? 'block' : 'none';
  localStorage.setItem('sidebar-collapsed', isCollapsed);
}

// Restore sidebar state on load
(function() {
  if (localStorage.getItem('sidebar-collapsed') === 'true') {
    var sidebar = document.getElementById('chat-sidebar');
    var expandBtn = document.getElementById('sidebar-expand-btn');
    if (sidebar) sidebar.classList.add('collapsed');
    if (expandBtn) expandBtn.style.display = 'block';
  }
})();

function loadChatList() {
  fetch('/api/chats')
    .then(function(r) { return r.json(); })
    .then(function(chats) {
      var list = document.getElementById('chat-list');
      if (!chats || chats.length === 0) {
        list.innerHTML = '<div class="empty" style="padding:16px;font-size:11px;color:var(--text-dim);">no chats yet</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < chats.length; i++) {
        var c = chats[i];
        var isActive = currentChatId === c.id;
        html += '<a href="/chats/' + c.id + '" class="chat-list-item' + (isActive ? ' active' : '') + '" onclick="event.preventDefault();selectChat(\'' + c.id + '\')">';
        html += '<div class="chat-info">';
        html += '<div class="chat-title">' + escapeHtml(c.title || 'Untitled') + '</div>';
        html += '<div class="chat-time">' + relativeTime(c.updated_at) + '</div>';
        html += '</div>';
        html += '<button class="chat-delete" onclick="event.preventDefault();event.stopPropagation();deleteChat(\'' + c.id + '\')" title="delete">&times;</button>';
        html += '</a>';
      }
      list.innerHTML = html;
    })
    .catch(function() {});
}

function selectChat(id) {
  currentChatId = id;
  history.pushState({chatId: id}, '', '/chats/' + id);
  loadChatList();
  fetch('/api/chats/' + id)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      renderMessages(data.messages || []);
    })
    .catch(function() {
      showEmptyState();
    });
}

function newChat() {
  currentChatId = null;
  history.pushState({chatId: null}, '', '/');
  loadChatList();
  showEmptyState();
  document.getElementById('query-input').focus();
}

function deleteChat(id) {
  fetch('/api/chats/' + id, { method: 'DELETE' })
    .then(function() {
      if (currentChatId === id) {
        currentChatId = null;
        history.pushState({chatId: null}, '', '/');
        showEmptyState();
      }
      loadChatList();
    })
    .catch(function() {});
}

function showEmptyState() {
  var area = document.getElementById('message-area-inner');
  area.innerHTML = '<div class="empty-state" id="empty-state">' +
    '<div class="empty-state-prompt">$_</div>' +
    '<div class="empty-state-text">start a new investigation</div>' +
    '<div class="empty-state-hint">describe an issue, ask a question, or paste an error</div>' +
    '</div>';
}

// --- Messages ---

function renderMessages(messages) {
  var area = document.getElementById('message-area-inner');
  area.innerHTML = '';

  if (!messages || messages.length === 0) {
    showEmptyState();
    return;
  }

  for (var i = 0; i < messages.length; i++) {
    var msg = messages[i];

    if (msg.role === 'user') {
      area.appendChild(createUserBubble(msg.content));
    } else if (msg.role === 'assistant') {
      area.appendChild(createAssistantBubble(msg.content));
    } else if (msg.role === 'tool_call') {
      var args = null;
      try { args = JSON.parse(msg.content); } catch(e) {}
      area.appendChild(createTimelineStep('tool_call', msg.content, msg.tool_name, args));
    } else if (msg.role === 'observation') {
      area.appendChild(createTimelineStep('observation', msg.content, msg.tool_name, null));
    } else if (msg.role === 'thinking') {
      area.appendChild(createTimelineStep('thinking', msg.content, '', null));
    } else if (msg.role === 'plan') {
      var steps = [];
      try { steps = JSON.parse(msg.content); } catch(e) {}
      if (steps.length > 0) {
        var panel = createPlanPanel(steps);
        for (var j = 0; j < steps.length; j++) {
          updatePlanStep(panel, steps[j].id, 'completed');
        }
        panel.classList.add('completed');
        area.appendChild(panel);
      }
    }
  }

  scrollToBottom();
}

function createUserBubble(content) {
  var div = document.createElement('div');
  div.className = 'message message-user';
  div.innerHTML = '<div class="message-role">&gt; you</div><div class="message-content"><pre>' + escapeHtml(content) + '</pre></div>';
  return div;
}

marked.setOptions({
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      return hljs.highlight(code, { language: lang }).value;
    }
    return hljs.highlightAuto(code).value;
  }
});

function renderMarkdown(text) {
  var raw = marked.parse(text);
  return DOMPurify.sanitize(raw);
}

function createAssistantBubble(content) {
  if (!content || !content.trim()) {
    var empty = document.createElement('div');
    empty.style.display = 'none';
    return empty;
  }
  var div = document.createElement('div');
  div.className = 'message message-assistant';
  div.innerHTML = '<div class="message-role">$ assistant</div><div class="message-content markdown-body">' + renderMarkdown(content) + '</div>';
  return div;
}

function truncateText(text, maxLen) {
  if (!text) return '';
  // Try to extract a meaningful summary from JSON
  var summary = text;
  try {
    var parsed = JSON.parse(text);
    if (parsed.reasoning) summary = parsed.reasoning;
    else if (parsed.type === 'tool_call' && parsed.tool) summary = 'call ' + parsed.tool;
    else if (typeof parsed === 'string') summary = parsed;
  } catch(e) {}
  if (summary.length > maxLen) return summary.substring(0, maxLen) + '...';
  return summary;
}

function createTimelineStep(stepType, content, toolName, args) {
  var div = document.createElement('div');
  div.className = 'timeline-step timeline-' + stepType;

  var labelDiv = document.createElement('div');
  labelDiv.className = 'timeline-label';

  var bodyDiv = document.createElement('div');
  bodyDiv.className = 'timeline-body';

  if (stepType === 'thinking') {
    var summary = content;
    try {
      var parsed = JSON.parse(content);
      if (parsed.type === 'final_answer') {
        div.style.display = 'none';
        return div;
      }
      if (parsed.type === 'tool_call' && parsed.tool) {
        summary = 'Planning to call ' + parsed.tool + '...';
      } else if (parsed.reasoning) {
        summary = parsed.reasoning;
      } else if (typeof parsed === 'string') {
        summary = parsed;
      }
    } catch(e) {}
    labelDiv.textContent = 'thinking';
    // Add inline summary
    var summarySpan = document.createElement('span');
    summarySpan.className = 'timeline-summary';
    summarySpan.textContent = truncateText(summary, 60);
    labelDiv.appendChild(summarySpan);
    var pre = document.createElement('pre');
    pre.textContent = summary;
    bodyDiv.appendChild(pre);
  } else if (stepType === 'tool_call') {
    labelDiv.textContent = 'tool: ' + (toolName || 'unknown');
    var summarySpan = document.createElement('span');
    summarySpan.className = 'timeline-summary';
    if (args && typeof args === 'object') {
      var keys = Object.keys(args);
      summarySpan.textContent = keys.length > 0 ? truncateText(JSON.stringify(args[keys[0]]), 50) : '';
    } else {
      summarySpan.textContent = truncateText(content, 50);
    }
    labelDiv.appendChild(summarySpan);
    if (args && typeof args === 'object') {
      bodyDiv.appendChild(formatToolArgs(args));
    } else {
      var pre = document.createElement('pre');
      pre.textContent = content;
      bodyDiv.appendChild(pre);
    }
  } else if (stepType === 'observation') {
    labelDiv.textContent = 'result' + (toolName ? ' (' + toolName + ')' : '');
    var summarySpan = document.createElement('span');
    summarySpan.className = 'timeline-summary';
    summarySpan.textContent = truncateText(content, 60);
    labelDiv.appendChild(summarySpan);
    var pre = document.createElement('pre');
    pre.textContent = content;
    bodyDiv.appendChild(pre);
  } else if (stepType === 'error') {
    labelDiv.textContent = 'error';
    var pre = document.createElement('pre');
    pre.textContent = content;
    pre.style.color = 'var(--red)';
    bodyDiv.appendChild(pre);
    // Auto-expand errors
    div.classList.add('expanded');
  }

  div.appendChild(labelDiv);
  div.appendChild(bodyDiv);
  return div;
}

function formatToolArgs(args) {
  var container = document.createElement('div');
  container.className = 'tool-args';
  var keys = Object.keys(args);
  for (var i = 0; i < keys.length; i++) {
    var line = document.createElement('div');
    line.className = 'arg-line';

    var connector = document.createElement('span');
    connector.className = 'arg-connector';
    connector.textContent = (i === keys.length - 1) ? '\u2514\u2500 ' : '\u251C\u2500 ';

    var key = document.createElement('span');
    key.className = 'arg-key';
    key.textContent = keys[i] + ': ';

    var val = document.createElement('span');
    val.className = 'arg-value';
    var v = args[keys[i]];
    val.textContent = (typeof v === 'string') ? '"' + v + '"' : JSON.stringify(v);

    line.appendChild(connector);
    line.appendChild(key);
    line.appendChild(val);
    container.appendChild(line);
  }
  return container;
}

// --- Click-to-expand timeline steps ---
document.getElementById('message-area').addEventListener('click', function(e) {
  var step = e.target.closest('.timeline-step');
  if (!step) return;
  // Don't toggle if clicking inside body (e.g. selecting text)
  if (e.target.closest('.timeline-body')) return;
  step.classList.toggle('expanded');
});

// --- Sticky Progress Panel ---

function stickyPlan(panel) {
  var wrapper = document.getElementById('plan-sticky-wrapper');
  wrapper.innerHTML = '';
  wrapper.appendChild(panel);
  planIsSticky = true;
}

function unstickyPlan() {
  if (!planIsSticky || !activePlanPanel) return;
  var wrapper = document.getElementById('plan-sticky-wrapper');
  var area = document.getElementById('message-area-inner');
  area.appendChild(activePlanPanel);
  wrapper.innerHTML = '';
  planIsSticky = false;
}

function createProgressPanel() {
  var panel = document.createElement('div');
  panel.className = 'plan-panel active';
  panel.id = 'plan-panel';
  var header = document.createElement('div');
  header.className = 'plan-header';
  header.textContent = 'investigation progress';
  panel.appendChild(header);
  return panel;
}

function addProgressStep(panel, num, toolName) {
  var step = document.createElement('div');
  step.className = 'plan-step in_progress';
  step.setAttribute('data-step-num', num);
  var icon = document.createElement('span');
  icon.className = 'plan-step-icon spinner-icon';
  icon.textContent = '\u25D4';
  step.appendChild(icon);
  var desc = document.createElement('span');
  desc.className = 'plan-step-desc';
  desc.textContent = toolName;
  step.appendChild(desc);
  panel.appendChild(step);
}

function completeProgressStep(panel, num) {
  var step = panel.querySelector('[data-step-num="' + num + '"]');
  if (!step) return;
  step.classList.remove('in_progress');
  step.classList.add('completed');
  var icon = step.querySelector('.plan-step-icon');
  icon.textContent = '\u2714';
  icon.classList.remove('spinner-icon');
}

function finishProgressPanel() {
  if (!activePlanPanel) return;
  // Complete last step
  var inProgress = activePlanPanel.querySelector('.plan-step.in_progress');
  if (inProgress) {
    var num = inProgress.getAttribute('data-step-num');
    completeProgressStep(activePlanPanel, num);
  }
  activePlanPanel.classList.remove('active');
  activePlanPanel.classList.add('completed');
  unstickyPlan();
  activePlanPanel = null;
}

// --- Plan Panel (legacy, for historical plan data) ---

function createPlanPanel(steps) {
  var panel = document.createElement('div');
  panel.className = 'plan-panel';
  panel.id = 'plan-panel';

  var header = document.createElement('div');
  header.className = 'plan-header';
  header.textContent = 'investigation plan';
  panel.appendChild(header);

  for (var i = 0; i < steps.length; i++) {
    var step = document.createElement('div');
    step.className = 'plan-step pending';
    step.setAttribute('data-step-id', steps[i].id);

    var icon = document.createElement('span');
    icon.className = 'plan-step-icon';
    icon.textContent = '\u25CB'; // empty circle
    step.appendChild(icon);

    var desc = document.createElement('span');
    desc.className = 'plan-step-desc';
    desc.textContent = steps[i].id + '. ' + steps[i].description;
    step.appendChild(desc);

    panel.appendChild(step);
  }

  return panel;
}

function updatePlanStep(panel, stepId, status) {
  if (!panel) panel = document.getElementById('plan-panel');
  if (!panel) return;

  var steps = panel.querySelectorAll('.plan-step');
  for (var i = 0; i < steps.length; i++) {
    if (parseInt(steps[i].getAttribute('data-step-id')) === stepId) {
      var icon = steps[i].querySelector('.plan-step-icon');
      steps[i].classList.remove('pending', 'in_progress', 'completed');
      steps[i].classList.add(status);

      if (status === 'in_progress') {
        icon.textContent = '\u25D4'; // half circle
        icon.classList.add('spinner-icon');
      } else if (status === 'completed') {
        icon.textContent = '\u2714'; // checkmark
        icon.classList.remove('spinner-icon');
      }
      break;
    }
  }
}

// --- Investigation SSE ---

function startInvestigation(e) {
  e.preventDefault();
  var query = document.getElementById('query-input').value.trim();
  if (!query) return;

  var btn = document.getElementById('submit-btn');
  var input = document.getElementById('query-input');
  var status = document.getElementById('status-bar');
  var area = document.getElementById('message-area-inner');

  // Clear empty state
  var emptyEl = document.getElementById('empty-state');
  if (emptyEl) emptyEl.remove();

  // Un-stick and dim any previous progress panel
  finishProgressPanel();

  // Show user message immediately and save as anchor
  var userBubble = createUserBubble(query);
  area.appendChild(userBubble);
  scrollToBottom();

  // Disable input
  status.textContent = 'connecting...';
  btn.disabled = true;
  btn.textContent = 'running';
  btn.classList.add('spinner');
  input.disabled = true;
  input.value = '';

  // Build URL
  var url = '/api/investigate?query=' + encodeURIComponent(query);
  if (currentChatId) {
    url += '&chat_id=' + encodeURIComponent(currentChatId);
  }
  var providerSelect = document.getElementById('provider-select');
  if (providerSelect && providerSelect.value) {
    url += '&provider=' + encodeURIComponent(providerSelect.value);
  }

  // Streaming state
  var stepCount = 0;
  var toolStepCount = 0;

  if (eventSource) {
    eventSource.close();
  }
  eventSource = new EventSource(url);

  eventSource.onmessage = function(event) {
    var data = JSON.parse(event.data);

    // Handle chat_id event
    if (data.step_type === 'chat_id') {
      currentChatId = data.content;
      history.pushState({chatId: data.content}, '', '/chats/' + data.content);
      loadChatList();
      return;
    }

    stepCount++;

    if (data.step_type === 'final') {
      finishProgressPanel();
      area.appendChild(createAssistantBubble(data.content));
      status.textContent = 'done (' + stepCount + ' steps)';

      // Collapse all streaming-expanded steps
      var allSteps = area.querySelectorAll('.timeline-step.streaming-expanded');
      for (var s = 0; s < allSteps.length; s++) {
        allSteps[s].classList.remove('expanded', 'streaming-expanded');
      }
    } else if (data.step_type === 'error') {
      finishProgressPanel();
      area.appendChild(createTimelineStep('error', data.content, data.tool_name, null));
      status.textContent = 'error';
    } else if (data.step_type === 'tool_call') {
      // Synthesize progress panel from tool_call events
      if (!activePlanPanel) {
        activePlanPanel = createProgressPanel();
        stickyPlan(activePlanPanel);
      }
      // Complete previous step
      if (toolStepCount > 0) {
        completeProgressStep(activePlanPanel, toolStepCount);
      }
      toolStepCount++;
      addProgressStep(activePlanPanel, toolStepCount, data.tool_name || 'tool');
      status.textContent = 'calling ' + (data.tool_name || 'tool') + '...';

      // Also add inline timeline step
      var stepEl = createTimelineStep(data.step_type, data.content, data.tool_name, data.args || null);
      area.appendChild(stepEl);

      // Auto-expand latest step during streaming, collapse previous
      var allSteps = area.querySelectorAll('.timeline-step.streaming-expanded');
      for (var s = 0; s < allSteps.length; s++) {
        allSteps[s].classList.remove('expanded', 'streaming-expanded');
      }
      stepEl.classList.add('expanded', 'streaming-expanded');
    } else {
      // Inline timeline step (thinking, observation)
      var stepEl = createTimelineStep(data.step_type, data.content, data.tool_name, data.args || null);
      area.appendChild(stepEl);

      // Auto-expand latest step during streaming, collapse previous
      var allSteps = area.querySelectorAll('.timeline-step.streaming-expanded');
      for (var s = 0; s < allSteps.length; s++) {
        allSteps[s].classList.remove('expanded', 'streaming-expanded');
      }
      stepEl.classList.add('expanded', 'streaming-expanded');

      // Contextual status
      if (data.step_type === 'thinking') {
        status.textContent = 'thinking...';
      } else if (data.step_type === 'observation') {
        status.textContent = 'processing result...';
      } else {
        status.textContent = 'step ' + stepCount + '...';
      }
    }

    scrollToBottom();
  };

  eventSource.onerror = function() {
    eventSource.close();
    eventSource = null;

    finishProgressPanel();

    btn.disabled = false;
    btn.textContent = 'run';
    btn.classList.remove('spinner');
    input.disabled = false;

    // Collapse all streaming-expanded steps
    var allSteps = area.querySelectorAll('.timeline-step.streaming-expanded');
    for (var s = 0; s < allSteps.length; s++) {
      allSteps[s].classList.remove('expanded', 'streaming-expanded');
    }

    if (stepCount === 0) {
      status.textContent = 'connection failed';
    }

    loadChatList();
  };
}

// --- Helpers ---

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function scrollToBottom() {
  var area = document.getElementById('message-area');
  area.scrollTop = area.scrollHeight;
}

function relativeTime(dateStr) {
  if (!dateStr) return '';
  var now = new Date();
  var then = new Date(dateStr);
  var diffMs = now - then;
  var diffSec = Math.floor(diffMs / 1000);
  var diffMin = Math.floor(diffSec / 60);
  var diffHr = Math.floor(diffMin / 60);
  var diffDay = Math.floor(diffHr / 24);

  if (diffSec < 60) return 'just now';
  if (diffMin < 60) return diffMin + 'm ago';
  if (diffHr < 24) return diffHr + 'h ago';
  if (diffDay < 7) return diffDay + 'd ago';
  return then.toLocaleDateString();
}

// --- Providers ---

function loadProviders() {
  fetch('/api/providers')
    .then(function(r) { return r.json(); })
    .then(function(providers) {
      var sel = document.getElementById('provider-select');
      sel.innerHTML = '';
      if (!providers || providers.length === 0) return;
      for (var i = 0; i < providers.length; i++) {
        var opt = document.createElement('option');
        opt.value = providers[i].name;
        opt.textContent = providers[i].name + ' (' + providers[i].model + ')';
        sel.appendChild(opt);
      }
    })
    .catch(function() {});
}

// --- Browser Navigation ---

window.addEventListener('popstate', function(e) {
  var chatId = (e.state && e.state.chatId) ? e.state.chatId : null;
  currentChatId = chatId;
  if (chatId) {
    loadChatList();
    fetch('/api/chats/' + chatId)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        renderMessages(data.messages || []);
      })
      .catch(function() {
        showEmptyState();
      });
  } else {
    loadChatList();
    showEmptyState();
  }
});

// --- Keyboard Shortcuts ---

document.addEventListener('keydown', function(e) {
  var mod = e.metaKey || e.ctrlKey;
  if (mod && e.key === 'n') {
    e.preventDefault();
    newChat();
  }
  if (mod && e.key === 'b') {
    e.preventDefault();
    toggleSidebar();
  }
  if (e.key === 'Escape') {
    // Cancel running stream if active
    if (eventSource) {
      eventSource.close();
      eventSource = null;
      finishProgressPanel();
      var btn = document.getElementById('submit-btn');
      var input = document.getElementById('query-input');
      btn.disabled = false;
      btn.textContent = 'run';
      btn.classList.remove('spinner');
      input.disabled = false;
      document.getElementById('status-bar').textContent = 'cancelled';

      // Collapse all streaming-expanded steps
      var allSteps = document.getElementById('message-area-inner').querySelectorAll('.timeline-step.streaming-expanded');
      for (var s = 0; s < allSteps.length; s++) {
        allSteps[s].classList.remove('expanded', 'streaming-expanded');
      }
    }
    document.getElementById('query-input').focus();
  }
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    e.preventDefault();
    document.getElementById('query-input').focus();
  }
});

// --- Init ---
loadChatList();
loadProviders();
if (currentChatId) {
  history.replaceState({chatId: currentChatId}, '', '/chats/' + currentChatId);
  fetch('/api/chats/' + currentChatId)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      renderMessages(data.messages || []);
    })
    .catch(function() {
      showEmptyState();
    });
}
</script>
{{end}}
