{{define "content"}}
<div class="page-header">
  <h1><span class="prompt">$</span> alerts <span class="dim" id="alerts-count"></span></h1>
  <div class="actions">
    <button id="dismiss-all-btn" class="btn btn-sm btn-danger" onclick="dismissAllAlerts()" style="display:none">dismiss all</button>
    <button id="mark-all-read-btn" class="btn btn-sm" onclick="markAllRead()" style="display:none">mark all read</button>
  </div>
</div>

<div class="filter-bar" id="alert-filter-bar">
  <div class="filter-bar-tags">
    <div class="filter-tag" id="tag-status" onclick="toggleAlertDropdown('status',event)" title="status — key: s">
      <span class="filter-tag-key">s:</span>
      <span class="filter-tag-val" id="tag-status-val">unread</span>
      <div class="filter-dropdown" id="drop-status"></div>
    </div>
    <div class="filter-tag" id="tag-severity" onclick="toggleAlertDropdown('severity',event)" title="severity — key: v">
      <span class="filter-tag-key">v:</span>
      <span class="filter-tag-val" id="tag-severity-val">all</span>
      <div class="filter-dropdown" id="drop-severity"></div>
    </div>
    <div class="filter-tag" id="tag-monitor" onclick="toggleAlertDropdown('monitor',event)" title="monitor — key: m">
      <span class="filter-tag-key">m:</span>
      <span class="filter-tag-val" id="tag-monitor-val">all</span>
      <div class="filter-dropdown" id="drop-monitor"></div>
    </div>
    <div class="filter-tag" id="tag-group" onclick="toggleGrouping(event)" title="group by monitor — key: g">
      <span class="filter-tag-key">g:</span>
      <span class="filter-tag-val" id="tag-group-val">off</span>
    </div>
  </div>
  <div class="filter-bar-actions">
    <button type="button" class="filter-bar-btn btn-clear" onclick="clearAlertFilters()">clear</button>
  </div>
</div>

<div id="bulk-bar" class="bulk-bar" style="display:none">
  <span><span class="bulk-count" id="bulk-count">0</span> selected</span>
  <div class="bulk-actions">
    <button class="btn btn-sm" onclick="bulkMarkRead()">mark read</button>
    <button class="btn btn-sm btn-danger" onclick="bulkDismiss()">dismiss</button>
  </div>
</div>

<div id="alerts-list">
  <div class="loading-state" id="alerts-loading">loading alerts</div>
  <div class="empty-state" id="alerts-empty" style="display:none">
    <div class="empty-icon">--</div>
    <p class="empty-state-title" id="empty-title">No alerts yet</p>
    <p class="empty-state-desc" id="empty-desc">Alerts are generated when your monitors detect an issue. Set up a monitor to start receiving alerts.</p>
    <a href="/watchers" class="btn btn-primary" id="empty-action">Set up a monitor</a>
  </div>
</div>

<script nonce="{{.CSPNonce}}">
var allAlerts = [];
var alertCounts = { count: 0, total: 0 };
var isAdmin = {{.IsAdmin}};
var selectedAlerts = {};

// ── Filter state ──────────────────────────────────────────
var STATUS_OPTIONS = ['unread', 'all', 'dismissed'];
var STATUS_LABELS  = ['unread', 'all', 'dismissed'];
var SEV_OPTIONS = ['', 'critical', 'warning', 'info'];
var SEV_LABELS  = ['all', 'crit', 'warn', 'info'];
var monitorList = [{id:'', title:'all'}];
var currentStatusIdx = 0;
var currentSevIdx = 0;
var currentMonitorIdx = 0;
var grouped = false;

// ── URL sync ──────────────────────────────────────────────
function initFromUrl() {
  var params = new URLSearchParams(window.location.search);
  var s = params.get('status') || 'unread';
  var idx = STATUS_OPTIONS.indexOf(s);
  if (idx >= 0) currentStatusIdx = idx;
  var sev = params.get('severity') || '';
  var si = SEV_OPTIONS.indexOf(sev);
  if (si >= 0) currentSevIdx = si;
  var wid = params.get('watcher_id') || '';
  if (wid) {
    for (var i = 0; i < monitorList.length; i++) {
      if (monitorList[i].id === wid) { currentMonitorIdx = i; break; }
    }
  }
  updateTagDisplay('tag-status-val', STATUS_LABELS[currentStatusIdx], currentStatusIdx !== 0);
  updateTagDisplay('tag-severity-val', SEV_LABELS[currentSevIdx], currentSevIdx !== 0);
  updateTagDisplay('tag-monitor-val', monitorList[currentMonitorIdx].title, currentMonitorIdx !== 0);
  updateTagDisplay('tag-group-val', grouped ? 'on' : 'off', grouped);
}

function syncToUrl() {
  var params = new URLSearchParams();
  if (STATUS_OPTIONS[currentStatusIdx] !== 'unread') params.set('status', STATUS_OPTIONS[currentStatusIdx]);
  if (SEV_OPTIONS[currentSevIdx]) params.set('severity', SEV_OPTIONS[currentSevIdx]);
  if (monitorList[currentMonitorIdx].id) params.set('watcher_id', monitorList[currentMonitorIdx].id);
  var qs = params.toString();
  var url = window.location.pathname + (qs ? '?' + qs : '');
  history.replaceState(null, '', url);
}

// ── Tag display & flash ───────────────────────────────────
function updateTagDisplay(elId, text, isActive) {
  var el = document.getElementById(elId);
  el.textContent = text;
  el.className = 'filter-tag-val' + (isActive ? ' val-active' : ' val-all');
}

function flashTag(tagId) {
  var el = document.getElementById(tagId);
  el.classList.remove('filter-flash');
  void el.offsetWidth;
  el.classList.add('filter-flash');
}

// ── Dropdown menus ────────────────────────────────────────
var openDrop = null;

function closeAllAlertDropdowns() {
  document.querySelectorAll('#alert-filter-bar .filter-dropdown.show').forEach(function(d){ d.classList.remove('show'); });
  openDrop = null;
}

function renderDropdown(dropId, options, labels, currentIdx, selectFn) {
  var drop = document.getElementById(dropId);
  var html = '';
  for (var i = 0; i < options.length; i++) {
    var cls = i === currentIdx ? 'filter-drop-item drop-active' : 'filter-drop-item';
    html += '<button type="button" class="' + cls + '" data-idx="' + i + '">' + escapeHtml(labels[i]) + '</button>';
  }
  drop.innerHTML = html;
  drop.querySelectorAll('.filter-drop-item').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      selectFn(parseInt(btn.getAttribute('data-idx')));
      closeAllAlertDropdowns();
    });
  });
}

function toggleAlertDropdown(name, e) {
  e.stopPropagation();
  var dropId = 'drop-' + name;
  var drop = document.getElementById(dropId);
  var wasOpen = drop.classList.contains('show');
  closeAllAlertDropdowns();
  if (wasOpen) return;

  if (name === 'status') renderDropdown(dropId, STATUS_OPTIONS, STATUS_LABELS, currentStatusIdx, selectStatus);
  else if (name === 'severity') renderDropdown(dropId, SEV_OPTIONS, SEV_LABELS, currentSevIdx, selectSeverity);
  else if (name === 'monitor') {
    var ids = monitorList.map(function(m){ return m.id; });
    var mLabels = monitorList.map(function(m){ return m.title; });
    renderDropdown(dropId, ids, mLabels, currentMonitorIdx, selectMonitor);
  }
  drop.classList.add('show');
  openDrop = dropId;
}
window.toggleAlertDropdown = toggleAlertDropdown;

document.addEventListener('click', function(){ closeAllAlertDropdowns(); });

// ── Select functions ──────────────────────────────────────
function selectStatus(idx) {
  currentStatusIdx = idx;
  updateTagDisplay('tag-status-val', STATUS_LABELS[idx], idx !== 0);
  flashTag('tag-status');
  selectedAlerts = {};
  updateBulkBar();
  syncToUrl();
  loadAlerts();
}

function selectSeverity(idx) {
  currentSevIdx = idx;
  updateTagDisplay('tag-severity-val', SEV_LABELS[idx], idx !== 0);
  flashTag('tag-severity');
  selectedAlerts = {};
  updateBulkBar();
  syncToUrl();
  loadAlerts();
}

function selectMonitor(idx) {
  currentMonitorIdx = idx;
  updateTagDisplay('tag-monitor-val', monitorList[idx].title, idx !== 0);
  flashTag('tag-monitor');
  selectedAlerts = {};
  updateBulkBar();
  syncToUrl();
  loadAlerts();
}

function toggleGrouping(e) {
  if (e) e.stopPropagation();
  grouped = !grouped;
  updateTagDisplay('tag-group-val', grouped ? 'on' : 'off', grouped);
  flashTag('tag-group');
  renderAlerts();
}
window.toggleGrouping = toggleGrouping;

// ── Cycle functions (keyboard) ────────────────────────────
function cycleStatus(dir) {
  selectStatus((currentStatusIdx + dir + STATUS_OPTIONS.length) % STATUS_OPTIONS.length);
}
function cycleSeverity(dir) {
  selectSeverity((currentSevIdx + dir + SEV_OPTIONS.length) % SEV_OPTIONS.length);
}
function cycleMonitor(dir) {
  selectMonitor((currentMonitorIdx + dir + monitorList.length) % monitorList.length);
}

// ── Clear all ─────────────────────────────────────────────
function clearAlertFilters() {
  currentStatusIdx = 0;
  currentSevIdx = 0;
  currentMonitorIdx = 0;
  grouped = false;
  updateTagDisplay('tag-status-val', STATUS_LABELS[0], false);
  updateTagDisplay('tag-severity-val', SEV_LABELS[0], false);
  updateTagDisplay('tag-monitor-val', monitorList[0].title, false);
  updateTagDisplay('tag-group-val', 'off', false);
  selectedAlerts = {};
  updateBulkBar();
  syncToUrl();
  loadAlerts();
}
window.clearAlertFilters = clearAlertFilters;

// ── Keyboard shortcuts ────────────────────────────────────
document.addEventListener('keydown', function(e){
  var tag = document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  var overlay = document.getElementById('shortcut-overlay');
  if (overlay && overlay.style.display !== 'none') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  closeAllAlertDropdowns();
  switch(e.key) {
    case 's': e.preventDefault(); cycleStatus(1); break;
    case 'S': e.preventDefault(); cycleStatus(-1); break;
    case 'v': e.preventDefault(); cycleSeverity(1); break;
    case 'V': e.preventDefault(); cycleSeverity(-1); break;
    case 'm': e.preventDefault(); cycleMonitor(1); break;
    case 'M': e.preventDefault(); cycleMonitor(-1); break;
    case 'g': e.preventDefault(); toggleGrouping(null); break;
    case 'c': e.preventDefault(); clearAlertFilters(); break;
  }
});

// ── Load watchers into monitorList ────────────────────────
function loadWatchers() {
  fetch('/api/watchers' + (getGlobalEnv() ? '?env=' + encodeURIComponent(getGlobalEnv()) : '')).then(function(r) { return r.json(); }).then(function(watchers) {
    monitorList = [{id:'', title:'all'}];
    (watchers || []).forEach(function(w) {
      monitorList.push({id: w.id, title: w.title});
    });
    // Re-resolve currentMonitorIdx from URL
    var params = new URLSearchParams(window.location.search);
    var wid = params.get('watcher_id') || '';
    if (wid) {
      for (var i = 0; i < monitorList.length; i++) {
        if (monitorList[i].id === wid) { currentMonitorIdx = i; break; }
      }
    }
    updateTagDisplay('tag-monitor-val', monitorList[currentMonitorIdx].title, currentMonitorIdx !== 0);
  }).catch(function() {});
}

// ── Load alerts ───────────────────────────────────────────
function loadAlerts() {
  var status = STATUS_OPTIONS[currentStatusIdx];
  var severity = SEV_OPTIONS[currentSevIdx];
  var watcherId = monitorList[currentMonitorIdx].id;
  var url = '/api/alerts?limit=100';
  if (status === 'unread') url += '&unread=true';
  if (status === 'dismissed') url += '&dismissed=true';
  if (severity) url += '&severity=' + encodeURIComponent(severity);
  if (watcherId) url += '&watcher_id=' + encodeURIComponent(watcherId);
  url += (getGlobalEnv() ? '&env=' + encodeURIComponent(getGlobalEnv()) : '');

  syncToUrl();

  fetch(url).then(function(r) { return r.json(); }).then(function(alerts) {
    allAlerts = alerts || [];
    renderAlerts();
  });

  loadCounts();
}

function loadCounts() {
  var url = '/api/alerts/count';
  url += (getGlobalEnv() ? '?env=' + encodeURIComponent(getGlobalEnv()) : '');
  fetch(url).then(function(r) { return r.json(); }).then(function(data) {
    alertCounts = data;
    updateHeaderCount();
    updateBadge();
    updateActionBtns();
    if (allAlerts.length === 0) renderAlerts();
  });
}

function updateHeaderCount() {
  var el = document.getElementById('alerts-count');
  if (!el) return;
  if (alertCounts.total === 0) {
    el.textContent = '';
    return;
  }
  var parts = [];
  parts.push(alertCounts.total + ' total');
  if (alertCounts.count > 0) parts.push(alertCounts.count + ' unread');
  el.textContent = parts.join(', ');
}

function updateActionBtns() {
  var markBtn = document.getElementById('mark-all-read-btn');
  var dismissBtn = document.getElementById('dismiss-all-btn');
  if (markBtn) markBtn.style.display = (isAdmin && alertCounts.count > 0) ? '' : 'none';
  if (dismissBtn) dismissBtn.style.display = (isAdmin && alertCounts.total > 0) ? '' : 'none';
}

function renderAlerts() {
  var container = document.getElementById('alerts-list');
  var empty = document.getElementById('alerts-empty');
  var loading = document.getElementById('alerts-loading');
  if (loading) loading.style.display = 'none';
  var status = STATUS_OPTIONS[currentStatusIdx];

  var expandedIDs = {};
  container.querySelectorAll('.alert-row.expanded').forEach(function(el) {
    expandedIDs[el.getAttribute('data-id')] = true;
  });

  if (allAlerts.length === 0) {
    container.innerHTML = '';
    container.appendChild(empty);
    empty.style.display = 'block';

    var title = document.getElementById('empty-title');
    var desc = document.getElementById('empty-desc');
    var action = document.getElementById('empty-action');

    var severity = SEV_OPTIONS[currentSevIdx];
    if (status === 'dismissed') {
      title.textContent = 'No dismissed alerts';
      desc.textContent = 'Dismissed alerts appear here for reference.';
      action.style.display = 'none';
    } else if (alertCounts.total > 0 && status === 'unread' && !severity) {
      title.textContent = 'All caught up';
      desc.textContent = 'No unread alerts \u2014 switch to "all" to see history.';
      action.style.display = 'none';
    } else if (alertCounts.total > 0) {
      title.textContent = 'No matching alerts';
      desc.textContent = 'Try adjusting your filters to see more results.';
      action.style.display = 'none';
    } else {
      title.textContent = 'No alerts yet';
      desc.textContent = 'Alerts are generated when your monitors detect an issue. Set up a monitor to start receiving alerts.';
      action.style.display = '';
    }
    return;
  }

  var html = '';
  if (grouped) {
    html = renderGrouped(expandedIDs, status);
  } else {
    html = renderFlat(allAlerts, expandedIDs, status);
  }
  container.innerHTML = html;
  updateBulkBar();
}

function renderGrouped(expandedIDs, status) {
  var groups = {};
  var order = [];
  allAlerts.forEach(function(a) {
    var key = a.watcher_id || '__none__';
    if (!groups[key]) {
      groups[key] = { title: a.watcher_title || 'Unknown monitor', alerts: [] };
      order.push(key);
    }
    groups[key].alerts.push(a);
  });

  var html = '';
  order.forEach(function(key) {
    var g = groups[key];
    html += '<div class="alert-group-header">' + escapeHtml(g.title) + '<span class="group-count">(' + g.alerts.length + ')</span></div>';
    html += renderFlat(g.alerts, expandedIDs, status);
  });
  return html;
}

function renderFlat(alerts, expandedIDs, status) {
  var isDismissedTab = status === 'dismissed';
  var html = '<div class="alert-list">';
  alerts.forEach(function(a) {
    var sevClass = 'severity-' + a.severity;
    var sevLabel = a.severity === 'critical' ? 'CRIT' : a.severity === 'warning' ? 'WARN' : 'INFO';
    var timeAgo = getTimeAgo(a.created_at);
    var readClass = a.read ? ' alert-read' : '';
    var expandClass = expandedIDs[a.id] ? ' expanded' : '';
    var checked = selectedAlerts[a.id] ? ' checked' : '';

    html += '<div class="alert-row ' + sevClass + readClass + expandClass + '" data-id="' + a.id + '">';
    html += '  <div class="alert-row-main">';
    if (isAdmin && !isDismissedTab) {
      html += '    <input type="checkbox" class="alert-checkbox" data-alert-id="' + a.id + '"' + checked + ' onclick="event.stopPropagation();toggleSelect(\'' + a.id + '\', this.checked)" />';
    }
    html += '    <span class="alert-ts" onclick="toggleAlert(this)">' + formatTimestamp(a.created_at) + '</span>';
    html += '    <span class="badge badge-' + a.severity + '" onclick="toggleAlert(this)">' + sevLabel + '</span>';
    if (a.environment) {
      html += '    <span class="alert-env" onclick="toggleAlert(this)">' + escapeHtml(a.environment) + '</span>';
    }
    html += '    <span class="alert-title-text" onclick="toggleAlert(this)">' + escapeHtml(a.title) + '</span>';
    if (a.watcher_title) {
      html += '    <span class="alert-env" onclick="toggleAlert(this)">' + escapeHtml(a.watcher_title) + '</span>';
    }
    html += '    <span class="alert-time-ago" onclick="toggleAlert(this)">' + timeAgo + '</span>';
    html += '  </div>';
    html += '  <div class="alert-detail">';
    html += '    <div class="alert-detail-summary">' + escapeHtml(a.summary) + '</div>';
    html += '    <div class="alert-detail-meta">';
    if (a.watcher_title) {
      html += '      <div class="alert-detail-row"><span class="alert-detail-key">watcher</span><a href="/watchers" class="alert-detail-val alert-link">' + escapeHtml(a.watcher_title) + '</a></div>';
    }
    if (a.environment) {
      html += '      <div class="alert-detail-row"><span class="alert-detail-key">env</span><span class="alert-detail-val">' + escapeHtml(a.environment) + '</span></div>';
    }
    html += '      <div class="alert-detail-row"><span class="alert-detail-key">severity</span><span class="alert-detail-val">' + a.severity + '</span></div>';
    html += '      <div class="alert-detail-row"><span class="alert-detail-key">time</span><span class="alert-detail-val">' + new Date(a.created_at).toLocaleString() + '</span></div>';
    if (a.read) {
      html += '      <div class="alert-detail-row"><span class="alert-detail-key">status</span><span class="alert-detail-val dim">read</span></div>';
    }
    if (a.dismissed) {
      html += '      <div class="alert-detail-row"><span class="alert-detail-key">status</span><span class="alert-detail-val dim">dismissed</span></div>';
    }
    html += '    </div>';
    if (isAdmin && !isDismissedTab) {
      html += '    <div class="alert-detail-actions">';
      if (!a.read) {
        html += '      <button class="btn btn-sm" onclick="event.stopPropagation();markRead(\'' + a.id + '\')">mark read</button>';
      }
      html += '      <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();dismissAlert(\'' + a.id + '\')">dismiss</button>';
      html += '    </div>';
    }
    html += '  </div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function toggleAlert(el) {
  var row = el.closest('.alert-row');
  if (row.classList.contains('expanded')) {
    row.classList.remove('expanded');
  } else {
    row.classList.add('expanded');
  }
}

/* Selection & bulk actions */
function toggleSelect(id, checked) {
  if (checked) { selectedAlerts[id] = true; } else { delete selectedAlerts[id]; }
  updateBulkBar();
}

function updateBulkBar() {
  var keys = Object.keys(selectedAlerts);
  var bar = document.getElementById('bulk-bar');
  if (!bar) return;
  if (keys.length > 0) {
    bar.style.display = 'flex';
    document.getElementById('bulk-count').textContent = keys.length;
  } else {
    bar.style.display = 'none';
  }
}

function bulkMarkRead() {
  var ids = Object.keys(selectedAlerts);
  if (ids.length === 0) return;
  var pending = ids.length;
  ids.forEach(function(id) {
    fetch('/api/alerts/' + id + '/read', { method: 'POST' }).then(function() {
      pending--;
      if (pending === 0) {
        showToast(ids.length + ' alert(s) marked as read', 'success');
        selectedAlerts = {};
        loadAlerts();
      }
    }).catch(function() { pending--; });
  });
}

function bulkDismiss() {
  var ids = Object.keys(selectedAlerts);
  if (ids.length === 0) return;
  var pending = ids.length;
  ids.forEach(function(id) {
    fetch('/api/alerts/' + id + '/dismiss', { method: 'POST' }).then(function() {
      pending--;
      if (pending === 0) {
        showToast(ids.length + ' alert(s) dismissed', 'success');
        selectedAlerts = {};
        loadAlerts();
      }
    }).catch(function() { pending--; });
  });
}

function markRead(id) {
  fetch('/api/alerts/' + id + '/read', { method: 'POST' }).then(function(r) {
    if (r.ok) showToast('Alert marked as read', 'info');
    loadAlerts();
  }).catch(function() { showToast('Failed to mark alert', 'error'); });
}

function markAllRead() {
  var url = '/api/alerts/read-all';
  url += (getGlobalEnv() ? '?env=' + encodeURIComponent(getGlobalEnv()) : '');
  fetch(url, { method: 'POST' }).then(function(r) {
    if (r.ok) showToast('All alerts marked as read', 'success');
    loadAlerts();
  }).catch(function() { showToast('Failed to mark alerts', 'error'); });
}

function dismissAlert(id) {
  fetch('/api/alerts/' + id + '/dismiss', { method: 'POST' }).then(function(r) {
    if (r.ok) showToast('Alert dismissed', 'info');
    loadAlerts();
  }).catch(function() { showToast('Failed to dismiss alert', 'error'); });
}

function dismissAllAlerts() {
  var url = '/api/alerts/dismiss-all';
  url += (getGlobalEnv() ? '?env=' + encodeURIComponent(getGlobalEnv()) : '');
  fetch(url, { method: 'POST' }).then(function(r) {
    if (r.ok) showToast('All alerts dismissed', 'success');
    loadAlerts();
  }).catch(function() { showToast('Failed to dismiss alerts', 'error'); });
}

function updateBadge() {
  var badge = document.getElementById('alert-badge');
  if (badge) {
    badge.textContent = alertCounts.count;
    badge.style.display = alertCounts.count > 0 ? 'inline' : 'none';
  }
}

function formatTimestamp(dateStr) {
  var d = new Date(dateStr);
  var pad = function(n) { return n < 10 ? '0' + n : n; };
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function getTimeAgo(dateStr) {
  var now = new Date();
  var date = new Date(dateStr);
  var diff = Math.floor((now - date) / 1000);
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

window.loadPageData = loadAlerts;
document.addEventListener('DOMContentLoaded', function() {
  initFromUrl();
  loadWatchers();
  loadAlerts();
  setInterval(function() { loadAlerts(); }, 30000);
});
</script>
{{end}}
