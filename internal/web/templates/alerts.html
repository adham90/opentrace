{{define "content"}}
<div class="page-header">
  <h1><span class="prompt">$</span> alerts <span class="dim" id="alerts-count"></span></h1>
  <div class="actions">
    <button id="dismiss-all-btn" class="btn btn-sm btn-danger" onclick="dismissAllAlerts()" style="display:none">dismiss all</button>
    <button id="mark-all-read-btn" class="btn btn-sm" onclick="markAllRead()" style="display:none">mark all read</button>
  </div>
</div>

<div class="alert-filters">
  <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
    <div class="filter-tabs" id="statusFilter" data-value="unread">
      <button class="filter-tab" data-value="all" onclick="setFilter('statusFilter','all')">all</button>
      <button class="filter-tab active" data-value="unread" onclick="setFilter('statusFilter','unread')">unread</button>
      <button class="filter-tab" data-value="dismissed" onclick="setFilter('statusFilter','dismissed')">dismissed</button>
    </div>
    <div class="filter-tabs" id="severityFilter" data-value="">
      <button class="filter-tab active" data-value="" onclick="setFilter('severityFilter','')">all</button>
      <button class="filter-tab sev-critical" data-value="critical" onclick="setFilter('severityFilter','critical')">crit</button>
      <button class="filter-tab sev-warning" data-value="warning" onclick="setFilter('severityFilter','warning')">warn</button>
      <button class="filter-tab sev-info" data-value="info" onclick="setFilter('severityFilter','info')">info</button>
    </div>
    <select id="watcherFilter" class="alert-filter-select" onchange="loadAlerts()">
      <option value="">all monitors</option>
    </select>
    <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-dim);cursor:pointer;">
      <input type="checkbox" id="groupToggle" onchange="renderAlerts()" style="accent-color:var(--green)"> group by monitor
    </label>
  </div>
</div>

<div id="bulk-bar" class="bulk-bar" style="display:none">
  <span><span class="bulk-count" id="bulk-count">0</span> selected</span>
  <div class="bulk-actions">
    <button class="btn btn-sm" onclick="bulkMarkRead()">mark read</button>
    <button class="btn btn-sm btn-danger" onclick="bulkDismiss()">dismiss</button>
  </div>
</div>

<div id="alerts-list">
  <div class="empty-state" id="alerts-empty" style="display:none">
    <div class="empty-icon">--</div>
    <p id="empty-title">no alerts yet</p>
    <p id="empty-desc">watchers will generate alerts when conditions are met</p>
    <a href="/watchers" class="btn btn-primary" id="empty-action">set up a watcher</a>
  </div>
</div>

<script>
var allAlerts = [];
var alertCounts = { count: 0, total: 0 };
var isAdmin = {{.IsAdmin}};
var selectedAlerts = {};
var watcherList = [];

function getUrlParams() {
  var params = new URLSearchParams(window.location.search);
  return {
    status: params.get('status') || 'unread',
    severity: params.get('severity') || '',
    watcher_id: params.get('watcher_id') || ''
  };
}

function setUrlParams(status, severity, watcherId) {
  var params = new URLSearchParams();
  if (status && status !== 'unread') params.set('status', status);
  if (severity) params.set('severity', severity);
  if (watcherId) params.set('watcher_id', watcherId);
  var qs = params.toString();
  var url = window.location.pathname + (qs ? '?' + qs : '');
  history.replaceState(null, '', url);
}

function initFilters() {
  var p = getUrlParams();
  setFilter('statusFilter', p.status, true);
  setFilter('severityFilter', p.severity, true);
  if (p.watcher_id) {
    document.getElementById('watcherFilter').value = p.watcher_id;
  }
}

function setFilter(groupId, value, silent) {
  var group = document.getElementById(groupId);
  group.setAttribute('data-value', value);
  var tabs = group.querySelectorAll('.filter-tab');
  tabs.forEach(function(t) {
    t.classList.toggle('active', t.getAttribute('data-value') === value);
  });
  if (!silent) {
    selectedAlerts = {};
    updateBulkBar();
    var status = document.getElementById('statusFilter').getAttribute('data-value');
    var severity = document.getElementById('severityFilter').getAttribute('data-value');
    var watcherId = document.getElementById('watcherFilter').value;
    setUrlParams(status, severity, watcherId);
    loadAlerts();
  }
}

function loadWatchers() {
  fetch('/api/watchers' + (getGlobalEnv() ? '?env=' + encodeURIComponent(getGlobalEnv()) : '')).then(function(r) { return r.json(); }).then(function(watchers) {
    watcherList = watchers || [];
    var sel = document.getElementById('watcherFilter');
    var current = sel.value;
    sel.innerHTML = '<option value="">all monitors</option>';
    watcherList.forEach(function(w) {
      sel.innerHTML += '<option value="' + w.id + '">' + escapeHtml(w.title) + '</option>';
    });
    sel.value = current;
  }).catch(function() {});
}

function loadAlerts() {
  var status = document.getElementById('statusFilter').getAttribute('data-value');
  var severity = document.getElementById('severityFilter').getAttribute('data-value');
  var watcherId = document.getElementById('watcherFilter').value;
  var url = '/api/alerts?limit=100';
  if (status === 'unread') url += '&unread=true';
  if (status === 'dismissed') url += '&dismissed=true';
  if (severity) url += '&severity=' + encodeURIComponent(severity);
  if (watcherId) url += '&watcher_id=' + encodeURIComponent(watcherId);
  url += (getGlobalEnv() ? '&env=' + encodeURIComponent(getGlobalEnv()) : '');

  var wId = watcherId;
  setUrlParams(status, severity, wId);

  fetch(url).then(function(r) { return r.json(); }).then(function(alerts) {
    allAlerts = alerts || [];
    renderAlerts();
  });

  loadCounts();
}

function loadCounts() {
  var url = '/api/alerts/count';
  url += (getGlobalEnv() ? '?env=' + encodeURIComponent(getGlobalEnv()) : '');
  fetch(url).then(function(r) { return r.json(); }).then(function(data) {
    alertCounts = data;
    updateHeaderCount();
    updateBadge();
    updateActionBtns();
    if (allAlerts.length === 0) renderAlerts();
  });
}

function updateHeaderCount() {
  var el = document.getElementById('alerts-count');
  if (!el) return;
  if (alertCounts.total === 0) {
    el.textContent = '';
    return;
  }
  var parts = [];
  parts.push(alertCounts.total + ' total');
  if (alertCounts.count > 0) parts.push(alertCounts.count + ' unread');
  el.textContent = parts.join(', ');
}

function updateActionBtns() {
  var markBtn = document.getElementById('mark-all-read-btn');
  var dismissBtn = document.getElementById('dismiss-all-btn');
  if (markBtn) markBtn.style.display = (isAdmin && alertCounts.count > 0) ? '' : 'none';
  if (dismissBtn) dismissBtn.style.display = (isAdmin && alertCounts.total > 0) ? '' : 'none';
}

function renderAlerts() {
  var container = document.getElementById('alerts-list');
  var empty = document.getElementById('alerts-empty');
  var status = document.getElementById('statusFilter').getAttribute('data-value');
  var grouped = document.getElementById('groupToggle').checked;

  var expandedIDs = {};
  container.querySelectorAll('.alert-row.expanded').forEach(function(el) {
    expandedIDs[el.getAttribute('data-id')] = true;
  });

  if (allAlerts.length === 0) {
    container.innerHTML = '';
    container.appendChild(empty);
    empty.style.display = 'block';

    var title = document.getElementById('empty-title');
    var desc = document.getElementById('empty-desc');
    var action = document.getElementById('empty-action');

    var severity = document.getElementById('severityFilter').getAttribute('data-value');
    if (status === 'dismissed') {
      title.textContent = 'no dismissed alerts';
      desc.textContent = 'dismissed alerts appear here for reference';
      action.style.display = 'none';
    } else if (alertCounts.total > 0 && status === 'unread' && !severity) {
      title.textContent = 'all caught up';
      desc.textContent = 'no unread alerts \u2014 switch to "all" to see history';
      action.style.display = 'none';
    } else if (alertCounts.total > 0) {
      title.textContent = 'no matching alerts';
      desc.textContent = 'try adjusting your filters';
      action.style.display = 'none';
    } else {
      title.textContent = 'no alerts yet';
      desc.textContent = 'watchers will generate alerts when conditions are met';
      action.style.display = '';
    }
    return;
  }

  var html = '';
  if (grouped) {
    html = renderGrouped(expandedIDs, status);
  } else {
    html = renderFlat(allAlerts, expandedIDs, status);
  }
  container.innerHTML = html;
  updateBulkBar();
}

function renderGrouped(expandedIDs, status) {
  var groups = {};
  var order = [];
  allAlerts.forEach(function(a) {
    var key = a.watcher_id || '__none__';
    if (!groups[key]) {
      groups[key] = { title: a.watcher_title || 'Unknown monitor', alerts: [] };
      order.push(key);
    }
    groups[key].alerts.push(a);
  });

  var html = '';
  order.forEach(function(key) {
    var g = groups[key];
    html += '<div class="alert-group-header">' + escapeHtml(g.title) + '<span class="group-count">(' + g.alerts.length + ')</span></div>';
    html += renderFlat(g.alerts, expandedIDs, status);
  });
  return html;
}

function renderFlat(alerts, expandedIDs, status) {
  var isDismissedTab = status === 'dismissed';
  var html = '<div class="alert-list">';
  alerts.forEach(function(a) {
    var sevClass = 'severity-' + a.severity;
    var sevLabel = a.severity === 'critical' ? 'CRIT' : a.severity === 'warning' ? 'WARN' : 'INFO';
    var timeAgo = getTimeAgo(a.created_at);
    var readClass = a.read ? ' alert-read' : '';
    var expandClass = expandedIDs[a.id] ? ' expanded' : '';
    var checked = selectedAlerts[a.id] ? ' checked' : '';

    html += '<div class="alert-row ' + sevClass + readClass + expandClass + '" data-id="' + a.id + '">';
    html += '  <div class="alert-row-main">';
    if (isAdmin && !isDismissedTab) {
      html += '    <input type="checkbox" class="alert-checkbox" data-alert-id="' + a.id + '"' + checked + ' onclick="event.stopPropagation();toggleSelect(\'' + a.id + '\', this.checked)" />';
    }
    html += '    <span class="alert-ts" onclick="toggleAlert(this)">' + formatTimestamp(a.created_at) + '</span>';
    html += '    <span class="badge badge-' + a.severity + '" onclick="toggleAlert(this)">' + sevLabel + '</span>';
    if (a.environment) {
      html += '    <span class="alert-env" onclick="toggleAlert(this)">' + escapeHtml(a.environment) + '</span>';
    }
    html += '    <span class="alert-title-text" onclick="toggleAlert(this)">' + escapeHtml(a.title) + '</span>';
    if (a.watcher_title) {
      html += '    <span class="alert-env" onclick="toggleAlert(this)">' + escapeHtml(a.watcher_title) + '</span>';
    }
    html += '    <span class="alert-time-ago" onclick="toggleAlert(this)">' + timeAgo + '</span>';
    html += '  </div>';
    html += '  <div class="alert-detail">';
    html += '    <div class="alert-detail-summary">' + escapeHtml(a.summary) + '</div>';
    html += '    <div class="alert-detail-meta">';
    if (a.watcher_title) {
      html += '      <div class="alert-detail-row"><span class="alert-detail-key">watcher</span><a href="/watchers" class="alert-detail-val alert-link">' + escapeHtml(a.watcher_title) + '</a></div>';
    }
    if (a.environment) {
      html += '      <div class="alert-detail-row"><span class="alert-detail-key">env</span><span class="alert-detail-val">' + escapeHtml(a.environment) + '</span></div>';
    }
    html += '      <div class="alert-detail-row"><span class="alert-detail-key">severity</span><span class="alert-detail-val">' + a.severity + '</span></div>';
    html += '      <div class="alert-detail-row"><span class="alert-detail-key">time</span><span class="alert-detail-val">' + new Date(a.created_at).toLocaleString() + '</span></div>';
    if (a.read) {
      html += '      <div class="alert-detail-row"><span class="alert-detail-key">status</span><span class="alert-detail-val dim">read</span></div>';
    }
    if (a.dismissed) {
      html += '      <div class="alert-detail-row"><span class="alert-detail-key">status</span><span class="alert-detail-val dim">dismissed</span></div>';
    }
    html += '    </div>';
    if (isAdmin && !isDismissedTab) {
      html += '    <div class="alert-detail-actions">';
      if (!a.read) {
        html += '      <button class="btn btn-sm" onclick="event.stopPropagation();markRead(\'' + a.id + '\')">mark read</button>';
      }
      html += '      <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();dismissAlert(\'' + a.id + '\')">dismiss</button>';
      html += '    </div>';
    }
    html += '  </div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function toggleAlert(el) {
  var row = el.closest('.alert-row');
  if (row.classList.contains('expanded')) {
    row.classList.remove('expanded');
  } else {
    row.classList.add('expanded');
  }
}

/* Selection & bulk actions */
function toggleSelect(id, checked) {
  if (checked) { selectedAlerts[id] = true; } else { delete selectedAlerts[id]; }
  updateBulkBar();
}

function updateBulkBar() {
  var keys = Object.keys(selectedAlerts);
  var bar = document.getElementById('bulk-bar');
  if (!bar) return;
  if (keys.length > 0) {
    bar.style.display = 'flex';
    document.getElementById('bulk-count').textContent = keys.length;
  } else {
    bar.style.display = 'none';
  }
}

function bulkMarkRead() {
  var ids = Object.keys(selectedAlerts);
  if (ids.length === 0) return;
  var pending = ids.length;
  ids.forEach(function(id) {
    fetch('/api/alerts/' + id + '/read', { method: 'POST' }).then(function() {
      pending--;
      if (pending === 0) {
        showToast(ids.length + ' alert(s) marked as read', 'success');
        selectedAlerts = {};
        loadAlerts();
      }
    }).catch(function() { pending--; });
  });
}

function bulkDismiss() {
  var ids = Object.keys(selectedAlerts);
  if (ids.length === 0) return;
  var pending = ids.length;
  ids.forEach(function(id) {
    fetch('/api/alerts/' + id + '/dismiss', { method: 'POST' }).then(function() {
      pending--;
      if (pending === 0) {
        showToast(ids.length + ' alert(s) dismissed', 'success');
        selectedAlerts = {};
        loadAlerts();
      }
    }).catch(function() { pending--; });
  });
}

function markRead(id) {
  fetch('/api/alerts/' + id + '/read', { method: 'POST' }).then(function(r) {
    if (r.ok) showToast('Alert marked as read', 'info');
    loadAlerts();
  }).catch(function() { showToast('Failed to mark alert', 'error'); });
}

function markAllRead() {
  var url = '/api/alerts/read-all';
  url += (getGlobalEnv() ? '?env=' + encodeURIComponent(getGlobalEnv()) : '');
  fetch(url, { method: 'POST' }).then(function(r) {
    if (r.ok) showToast('All alerts marked as read', 'success');
    loadAlerts();
  }).catch(function() { showToast('Failed to mark alerts', 'error'); });
}

function dismissAlert(id) {
  fetch('/api/alerts/' + id + '/dismiss', { method: 'POST' }).then(function(r) {
    if (r.ok) showToast('Alert dismissed', 'info');
    loadAlerts();
  }).catch(function() { showToast('Failed to dismiss alert', 'error'); });
}

function dismissAllAlerts() {
  var url = '/api/alerts/dismiss-all';
  url += (getGlobalEnv() ? '?env=' + encodeURIComponent(getGlobalEnv()) : '');
  fetch(url, { method: 'POST' }).then(function(r) {
    if (r.ok) showToast('All alerts dismissed', 'success');
    loadAlerts();
  }).catch(function() { showToast('Failed to dismiss alerts', 'error'); });
}

function updateBadge() {
  var badge = document.getElementById('alert-badge');
  if (badge) {
    badge.textContent = alertCounts.count;
    badge.style.display = alertCounts.count > 0 ? 'inline' : 'none';
  }
}

function formatTimestamp(dateStr) {
  var d = new Date(dateStr);
  var pad = function(n) { return n < 10 ? '0' + n : n; };
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function getTimeAgo(dateStr) {
  var now = new Date();
  var date = new Date(dateStr);
  var diff = Math.floor((now - date) / 1000);
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

window.loadPageData = loadAlerts;
document.addEventListener('DOMContentLoaded', function() {
  initFilters();
  loadWatchers();
  loadAlerts();
  setInterval(function() { loadAlerts(); }, 30000);
});
</script>
{{end}}
