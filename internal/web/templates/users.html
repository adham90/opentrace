{{define "content"}}
<div class="settings-page">
  <div class="page-header">
    <h1><span class="prompt">$</span> users</h1>
    <div class="actions">
      <a href="/register" class="btn btn-primary btn-sm">+ Invite User</a>
    </div>
    <a href="/" class="page-close" title="Back to dashboard">&times;</a>
  </div>

  <div id="users-list">
    {{if .Users}}
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Email</th>
            <th>Display Name</th>
            <th>Role</th>
            <th>MCP</th>
            <th>Active</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {{range .Users}}
          <tr id="user-row-{{.ID}}">
            <td>{{.Email}}</td>
            <td>{{.DisplayName}}</td>
            <td>
              <select class="role-select" onchange="updateRole('{{.ID}}', this.value)" {{if not $.IsAdmin}}disabled{{end}}>
                <option value="admin" {{if eq (print .Role) "admin"}}selected{{end}}>admin</option>
                <option value="member" {{if eq (print .Role) "member"}}selected{{end}}>member</option>
              </select>
            </td>
            <td>
              <label class="toggle-label">
                <input type="checkbox" {{if .MCPEnabled}}checked{{end}} onchange="toggleMCP('{{.ID}}', this.checked)">
                <span class="toggle-text">{{if .MCPEnabled}}on{{else}}off{{end}}</span>
              </label>
            </td>
            <td>
              <label class="toggle-label">
                <input type="checkbox" {{if .IsActive}}checked{{end}} onchange="toggleActive('{{.ID}}', this.checked)">
                <span class="toggle-text">{{if .IsActive}}yes{{else}}no{{end}}</span>
              </label>
            </td>
            <td class="actions-cell">
              <button class="btn btn-sm" onclick="regenToken('{{.ID}}')">Regen Token</button>
              <button class="btn btn-sm btn-danger" onclick="deleteUser('{{.ID}}', '{{.Email}}')">Delete</button>
            </td>
          </tr>
          {{end}}
        </tbody>
      </table>
    </div>
    {{else}}
    <div class="empty-state">
      <div class="empty-icon">--</div>
      <p>no users registered</p>
    </div>
    {{end}}
  </div>

</div>

<script nonce="{{.CSPNonce}}">
function userApiCall(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(function(r) {
    if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'request failed'); });
    return r.json();
  });
}

function updateRole(id, role) {
  userApiCall('/api/users/' + id + '/role', {role: role}).catch(function(e) {
    if (typeof showToast === 'function') showToast('Error: ' + e.message, 'error');
    location.reload();
  });
}

function toggleMCP(id, enabled) {
  userApiCall('/api/users/' + id + '/mcp', {enabled: enabled}).catch(function(e) {
    if (typeof showToast === 'function') showToast('Error: ' + e.message, 'error');
    location.reload();
  });
}

function toggleActive(id, active) {
  userApiCall('/api/users/' + id + '/active', {active: active}).catch(function(e) {
    if (typeof showToast === 'function') showToast('Error: ' + e.message, 'error');
    location.reload();
  });
}

function regenToken(id) {
  if (!confirm('Regenerate MCP token? The old token will stop working.')) return;
  userApiCall('/api/users/' + id + '/mcp-token', {}).then(function(d) {
    if (typeof showToast === 'function') {
      showToast('New MCP token generated. Copy it now.', 'success', 0);
    }
    prompt('New MCP token (copy it now):', d.mcp_token);
  }).catch(function(e) {
    if (typeof showToast === 'function') showToast('Error: ' + e.message, 'error');
  });
}

function deleteUser(id, email) {
  if (!confirm('Delete user ' + email + '? This cannot be undone.')) return;
  fetch('/api/users/' + id, {method: 'DELETE'}).then(function(r) {
    if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'delete failed'); });
    location.reload();
  }).catch(function(e) {
    if (typeof showToast === 'function') showToast('Error: ' + e.message, 'error');
  });
}
</script>

<style nonce="{{.CSPNonce}}">
.role-select {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 3px 8px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
}
.toggle-label {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  cursor: pointer;
}
.toggle-text {
  font-size: 11px;
  color: var(--text-dim);
}
.actions-cell {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
}
@media (max-width: 699px) {
  .data-table th, .data-table td {
    padding: 0.4rem 0.5rem;
    font-size: 11px;
  }
  .data-table th { font-size: 9px; }
  .actions-cell {
    flex-direction: column;
    gap: 4px;
  }
}
@media (max-width: 379px) {
  .data-table th, .data-table td {
    padding: 0.3rem 0.4rem;
    font-size: 10px;
  }
}
</style>
{{end}}
