{{define "content"}}
<div class="users-page">
  <div class="page-header">
    <h1><span class="prompt">$</span> users</h1>
    <div class="actions">
      <a href="/register" class="btn btn-primary">+ Invite User</a>
    </div>
  </div>

  <div id="users-list" class="users-list">
    {{if .Users}}
    <table class="data-table">
      <thead>
        <tr>
          <th>Email</th>
          <th>Display Name</th>
          <th>Role</th>
          <th>MCP</th>
          <th>Active</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {{range .Users}}
        <tr id="user-row-{{.ID}}">
          <td>{{.Email}}</td>
          <td>{{.DisplayName}}</td>
          <td>
            <select class="role-select" onchange="updateRole('{{.ID}}', this.value)" {{if not $.IsAdmin}}disabled{{end}}>
              <option value="admin" {{if eq (print .Role) "admin"}}selected{{end}}>admin</option>
              <option value="member" {{if eq (print .Role) "member"}}selected{{end}}>member</option>
            </select>
          </td>
          <td>
            <label class="toggle-label">
              <input type="checkbox" {{if .MCPEnabled}}checked{{end}} onchange="toggleMCP('{{.ID}}', this.checked)">
              <span class="toggle-text">{{if .MCPEnabled}}enabled{{else}}disabled{{end}}</span>
            </label>
          </td>
          <td>
            <label class="toggle-label">
              <input type="checkbox" {{if .IsActive}}checked{{end}} onchange="toggleActive('{{.ID}}', this.checked)">
              <span class="toggle-text">{{if .IsActive}}active{{else}}disabled{{end}}</span>
            </label>
          </td>
          <td class="actions-cell">
            <button class="btn btn-sm" onclick="regenToken('{{.ID}}')">Regen MCP Token</button>
            <button class="btn btn-sm btn-danger" onclick="deleteUser('{{.ID}}', '{{.Email}}')">Delete</button>
          </td>
        </tr>
        {{end}}
      </tbody>
    </table>
    {{else}}
    <div class="empty-state">
      <div class="empty-icon">--</div>
      <p>no users registered</p>
    </div>
    {{end}}
  </div>
</div>

<script nonce="{{.CSPNonce}}">
function apiCall(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(function(r) {
    if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'request failed'); });
    return r.json();
  });
}

function updateRole(id, role) {
  apiCall('/api/users/' + id + '/role', {role: role}).catch(function(e) {
    alert('Error: ' + e.message);
    location.reload();
  });
}

function toggleMCP(id, enabled) {
  apiCall('/api/users/' + id + '/mcp', {enabled: enabled}).catch(function(e) {
    alert('Error: ' + e.message);
    location.reload();
  });
}

function toggleActive(id, active) {
  apiCall('/api/users/' + id + '/active', {active: active}).catch(function(e) {
    alert('Error: ' + e.message);
    location.reload();
  });
}

function regenToken(id) {
  if (!confirm('Regenerate MCP token? The old token will stop working.')) return;
  apiCall('/api/users/' + id + '/mcp-token', {}).then(function(d) {
    alert('New MCP token: ' + d.mcp_token + '\n\nCopy it now — it won\'t be shown again.');
  }).catch(function(e) {
    alert('Error: ' + e.message);
  });
}

function deleteUser(id, email) {
  if (!confirm('Delete user ' + email + '? This cannot be undone.')) return;
  fetch('/api/users/' + id, {method: 'DELETE'}).then(function(r) {
    if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'delete failed'); });
    location.reload();
  }).catch(function(e) {
    alert('Error: ' + e.message);
  });
}
</script>

<style>
.data-table {
  width: 100%;
  border-collapse: collapse;
}
.data-table th, .data-table td {
  padding: 0.75rem;
  text-align: left;
  border-bottom: 1px solid var(--border, #333);
}
.data-table th {
  font-size: 0.8rem;
  opacity: 0.6;
  text-transform: uppercase;
}
.role-select {
  background: var(--bg-secondary, #1a1a2e);
  border: 1px solid var(--border, #333);
  color: var(--fg, #e0e0e0);
  padding: 0.25rem 0.5rem;
  border-radius: 4px;
}
.toggle-label {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  cursor: pointer;
}
.toggle-text {
  font-size: 0.85rem;
}
.actions-cell {
  display: flex;
  gap: 0.5rem;
}
</style>
{{end}}
