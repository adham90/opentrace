{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenTrace{{if .Title}} — {{.Title}}{{end}}</title>
  <script>
  (function(){
    var t = localStorage.getItem('opentrace-theme');
    if (t === 'dark' || t === 'light') {
      document.documentElement.setAttribute('data-theme', t);
    }
  })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="logo">[opentrace]</a>
      <nav class="topbar-nav">
        <a href="/logs" class="nav-item {{if eq .Nav "logs"}}active{{end}}">1:logs</a>
        <a href="/alerts" class="nav-item {{if eq .Nav "alerts"}}active{{end}}">2:alerts<span id="alert-badge" class="nav-badge" style="display:none">0</span></a>
        <a href="/watchers" class="nav-item {{if eq .Nav "watchers"}}active{{end}}">3:watchers</a>
        <a href="/connectors" class="nav-item {{if eq .Nav "connectors"}}active{{end}}">4:connectors</a>
        <a href="/servers" class="nav-item {{if eq .Nav "servers"}}active{{end}}">5:servers</a>
        <a href="/tools" class="nav-item {{if eq .Nav "tools"}}active{{end}}">6:tools</a>
      </nav>
      <div class="topbar-right">
        <select id="env-select" class="topbar-select" onchange="setGlobalEnv(this.value)" title="Filter by environment">
          <option value="">all envs</option>
        </select>
        <span class="topbar-sep">│</span>
        {{if .User}}
        <div class="user-dropdown">
          <button class="user-dropdown-toggle" onclick="toggleUserMenu()">
            {{.User.DisplayName}}{{if .IsAdmin}} <span class="badge badge-type">admin</span>{{end}}
          </button>
          <div class="user-dropdown-menu" id="user-dropdown-menu">
            {{if .IsAdmin}}<a href="/admin/users" class="dropdown-item">users</a>{{end}}
            {{if .IsAdmin}}<a href="/admin/settings" class="dropdown-item">settings</a>{{end}}
            <a href="/profile" class="dropdown-item">profile</a>
            <a href="/setup" class="dropdown-item">setup</a>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item" onclick="cycleTheme(); event.stopPropagation();">
              <span id="theme-icon">&#9684;</span> theme: <span id="theme-label">system</span>
            </button>
            <div class="dropdown-divider"></div>
            <form method="POST" action="/logout"><button type="submit" class="dropdown-item dropdown-item-danger">logout</button></form>
          </div>
        </div>
        {{else}}
        <button class="topbar-theme-btn" onclick="cycleTheme()" title="Toggle theme">
          <span id="theme-icon">&#9684;</span> <span id="theme-label">system</span>
        </button>
        {{end}}
      </div>
    </div>
  </header>
  <main class="content">
    <div class="content-container">
      {{template "content" .}}
    </div>
  </main>
  <script>
  // Global environment management
  function getGlobalEnv() {
    return localStorage.getItem('opentrace-env') || '';
  }
  function setGlobalEnv(val) {
    if (val) {
      localStorage.setItem('opentrace-env', val);
    } else {
      localStorage.removeItem('opentrace-env');
    }
    if (typeof window.loadPageData === 'function') {
      window.loadPageData();
    }
    // Reload alert badge with new env
    updateBadge();
  }
  function loadEnvironments() {
    fetch('/api/environments').then(function(r){return r.json()}).then(function(envs){
      var sel = document.getElementById('env-select');
      if (!sel) return;
      var current = getGlobalEnv();
      // Clear all except first "all envs" option
      while (sel.options.length > 1) sel.remove(1);
      (envs || []).forEach(function(e){
        var opt = document.createElement('option');
        opt.value = e;
        opt.textContent = e;
        if (e === current) opt.selected = true;
        sel.appendChild(opt);
      });
    }).catch(function(){});
  }
  function updateBadge() {
    fetch('/api/alerts/count' + (getGlobalEnv() ? '?env=' + encodeURIComponent(getGlobalEnv()) : '')).then(function(r){return r.json()}).then(function(d){
      var b=document.getElementById('alert-badge');
      if(b){b.textContent=d.count;b.style.display=d.count>0?'inline':'none';}
    }).catch(function(){});
  }
  updateBadge();
  loadEnvironments();
  setInterval(updateBadge, 30000);

  (function(){
    var themes = ['system', 'dark', 'light'];
    var icons = {'system': '\u25D4', 'dark': '\u25CF', 'light': '\u25CB'};

    function getTheme() {
      return localStorage.getItem('opentrace-theme') || 'system';
    }

    function applyTheme(t) {
      if (t === 'dark' || t === 'light') {
        document.documentElement.setAttribute('data-theme', t);
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      var icon = document.getElementById('theme-icon');
      var label = document.getElementById('theme-label');
      if (icon) icon.textContent = icons[t] || icons['system'];
      if (label) label.textContent = t;
    }

    window.cycleTheme = function() {
      var current = getTheme();
      var idx = themes.indexOf(current);
      var next = themes[(idx + 1) % themes.length];
      localStorage.setItem('opentrace-theme', next);
      applyTheme(next);
    };

    applyTheme(getTheme());
  })();

  (function(){
    window.toggleUserMenu = function() {
      var menu = document.getElementById('user-dropdown-menu');
      if (menu) menu.classList.toggle('show');
    };
    document.addEventListener('click', function(e) {
      var dropdown = document.querySelector('.user-dropdown');
      var menu = document.getElementById('user-dropdown-menu');
      if (menu && dropdown && !dropdown.contains(e.target)) {
        menu.classList.remove('show');
      }
    });
  })();

  // Keyboard navigation (tmux-style: press 0-4 to switch tabs)
  (function(){
    var tabs = {1:'/logs', 2:'/alerts', 3:'/watchers', 4:'/connectors', 5:'/servers', 6:'/tools'};
    document.addEventListener('keydown', function(e) {
      var tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target.isContentEditable) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var n = parseInt(e.key, 10);
      if (tabs[n]) {
        window.location.href = tabs[n];
      }
    });
  })();
  </script>
  {{if .DevMode}}<script>(function(){var h='';setInterval(function(){fetch('/api/dev/hash').then(function(r){return r.text()}).then(function(v){if(h&&v!==h)location.reload();h=v}).catch(function(){})},1000)})();</script>{{end}}
</body>
</html>{{end}}
