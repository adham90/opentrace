{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenTrace{{if .Title}} — {{.Title}}{{end}}</title>
  <script nonce="{{.CSPNonce}}">
  (function(){
    var t = localStorage.getItem('opentrace-theme');
    if (t === 'dark' || t === 'light') {
      document.documentElement.setAttribute('data-theme', t);
    }
  })();
  </script>
  <script nonce="{{.CSPNonce}}">
  // CSRF token for fetch requests — reads from cookie set by CSRFProtect middleware.
  window.__csrfToken = (function() {
    var m = document.cookie.match('(?:^|;)\\s*opentrace_csrf=([^;]+)');
    return m ? decodeURIComponent(m[1]) : '{{.CSRFToken}}';
  })();
  // Patch fetch to auto-include CSRF header on same-origin state-changing requests.
  (function(){
    var _fetch = window.fetch;
    window.fetch = function(url, opts) {
      opts = opts || {};
      var method = (opts.method || 'GET').toUpperCase();
      if (method !== 'GET' && method !== 'HEAD' && method !== 'OPTIONS') {
        if (!opts.headers) opts.headers = {};
        if (typeof opts.headers.set === 'function') {
          if (!opts.headers.has('X-CSRF-Token')) opts.headers.set('X-CSRF-Token', window.__csrfToken);
        } else {
          if (!opts.headers['X-CSRF-Token']) opts.headers['X-CSRF-Token'] = window.__csrfToken;
        }
      }
      return _fetch.call(this, url, opts);
    };
  })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <div hx-get="/api/version/banner" hx-trigger="load" hx-swap="innerHTML" id="version-banner-container"></div>
  <div class="toast-container" id="toast-container"></div>

  <!-- Keyboard shortcut overlay -->
  <div id="shortcut-overlay" class="shortcut-overlay" style="display:none">
    <div class="shortcut-dialog">
      <div class="shortcut-title">Keyboard Shortcuts</div>
      <div class="shortcut-section">
        <div class="shortcut-section-label">Log Filters</div>
        <div class="shortcut-row"><kbd>/</kbd><span>Focus command line</span></div>
        <div class="shortcut-row"><kbd>c</kbd><span>Clear all filters</span></div>
        <div class="shortcut-row"><kbd>p</kbd><span>Toggle live/paused</span></div>
      </div>
      <div class="shortcut-section">
        <div class="shortcut-section-label">General</div>
        <div class="shortcut-row"><kbd>?</kbd><span>Show this help</span></div>
        <div class="shortcut-row"><kbd>Esc</kbd><span>Close overlay / modal</span></div>
      </div>
      <div class="shortcut-footer">Press <kbd>?</kbd> or <kbd>Esc</kbd> to close</div>
    </div>
  </div>

  <div class="layout-container">
    <main class="main-content{{if eq .Nav "dashboard"}} dashboard-page{{end}}{{if eq .Nav "logs"}} logs-page{{end}}">
      {{template "content" .}}
    </main>
  </div>

  <script nonce="{{.CSPNonce}}">
  (function(){
    var themes = ['system', 'dark', 'light'];

    function getTheme() {
      return localStorage.getItem('opentrace-theme') || 'system';
    }

    function applyTheme(t) {
      if (t === 'dark' || t === 'light') {
        document.documentElement.setAttribute('data-theme', t);
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
    }

    window.cycleTheme = function() {
      var current = getTheme();
      var idx = themes.indexOf(current);
      var next = themes[(idx + 1) % themes.length];
      localStorage.setItem('opentrace-theme', next);
      applyTheme(next);
    };

    applyTheme(getTheme());
  })();

  // Toast notification system
  (function(){
    var icons = {success: '\u2713', error: '\u2717', info: 'i', warning: '!'};
    window.showToast = function(message, type, duration) {
      type = type || 'info';
      duration = duration !== undefined ? duration : (type === 'error' ? 0 : 5000);
      var container = document.getElementById('toast-container');
      var toast = document.createElement('div');
      toast.className = 'toast toast-' + type;
      toast.innerHTML = '<span class="toast-icon">' + (icons[type] || 'i') + '</span>' +
        '<span class="toast-body">' + escapeHtmlGlobal(message) + '</span>';
      var closeBtn = document.createElement('button');
      closeBtn.className = 'toast-close';
      closeBtn.textContent = '\u00d7';
      closeBtn.addEventListener('click', function() { dismissToast(toast); });
      toast.appendChild(closeBtn);
      container.appendChild(toast);
      if (duration > 0) {
        setTimeout(function() { dismissToast(toast); }, duration);
      }
      return toast;
    };
    window.dismissToast = function(el) {
      if (!el || el.classList.contains('toast-removing')) return;
      el.classList.add('toast-removing');
      setTimeout(function() { if (el.parentElement) el.parentElement.removeChild(el); }, 200);
    };
    window.escapeHtmlGlobal = function(str) {
      var div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    };
  })();

  // Form validation helpers
  (function(){
    window.validateField = function(input, rules) {
      var value = input.value.trim();
      var errorEl = input.parentElement.querySelector('.form-error');
      if (!errorEl) {
        errorEl = document.createElement('div');
        errorEl.className = 'form-error';
        input.parentElement.appendChild(errorEl);
      }
      for (var i = 0; i < rules.length; i++) {
        var rule = rules[i];
        if (rule.required && !value) {
          input.classList.add('input-invalid');
          input.classList.remove('input-valid');
          errorEl.textContent = rule.message || 'This field is required';
          errorEl.style.display = 'block';
          return false;
        }
        if (rule.minLength && value.length < rule.minLength) {
          input.classList.add('input-invalid');
          input.classList.remove('input-valid');
          errorEl.textContent = rule.message || 'Minimum ' + rule.minLength + ' characters';
          errorEl.style.display = 'block';
          return false;
        }
        if (rule.pattern && value && !rule.pattern.test(value)) {
          input.classList.add('input-invalid');
          input.classList.remove('input-valid');
          errorEl.textContent = rule.message || 'Invalid format';
          errorEl.style.display = 'block';
          return false;
        }
      }
      input.classList.remove('input-invalid');
      if (value) input.classList.add('input-valid'); else input.classList.remove('input-valid');
      errorEl.style.display = 'none';
      return true;
    };
    window.clearValidation = function(input) {
      input.classList.remove('input-invalid', 'input-valid');
      var errorEl = input.parentElement.querySelector('.form-error');
      if (errorEl) errorEl.style.display = 'none';
    };
    window.setButtonLoading = function(btn, loading, originalText) {
      if (loading) {
        btn.setAttribute('data-original-text', btn.textContent);
        btn.textContent = originalText || 'saving...';
        btn.classList.add('btn-loading');
        btn.disabled = true;
      } else {
        btn.textContent = btn.getAttribute('data-original-text') || originalText || btn.textContent;
        btn.classList.remove('btn-loading');
        btn.disabled = false;
      }
    };
  })();

  // Keyboard shortcut overlay
  (function(){
    window.toggleShortcuts = function() {
      var overlay = document.getElementById('shortcut-overlay');
      if (overlay) overlay.style.display = overlay.style.display === 'none' ? 'flex' : 'none';
    };

    document.getElementById('shortcut-overlay').addEventListener('click', function(e) {
      if (e.target === this) toggleShortcuts();
    });

    document.addEventListener('keydown', function(e) {
      var tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target.isContentEditable) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      if (e.key === '?') {
        e.preventDefault();
        toggleShortcuts();
        return;
      }
      if (e.key === 'Escape') {
        var overlay = document.getElementById('shortcut-overlay');
        if (overlay && overlay.style.display !== 'none') {
          overlay.style.display = 'none';
          return;
        }
        // Close user menu if open
        var userMenu = document.getElementById('user-menu-dropdown');
        if (userMenu && userMenu.classList.contains('user-menu-open')) {
          userMenu.classList.remove('user-menu-open');
          return;
        }
        var modals = document.querySelectorAll('.modal[style*="flex"]');
        if (modals.length > 0) {
          modals[modals.length - 1].style.display = 'none';
          return;
        }
      }
    });
  })();
  </script>
  {{if .DevMode}}<script nonce="{{.CSPNonce}}">(function(){var h='';setInterval(function(){fetch('/api/dev/hash').then(function(r){return r.text()}).then(function(v){if(h&&v!==h)location.reload();h=v}).catch(function(){})},1000)})();</script>{{end}}
</body>
</html>{{end}}
