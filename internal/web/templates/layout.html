{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenTrace{{if .Title}} — {{.Title}}{{end}}</title>
  <script>
  (function(){
    var t = localStorage.getItem('opentrace-theme');
    if (t === 'dark' || t === 'light') {
      document.documentElement.setAttribute('data-theme', t);
    }
  })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="logo">OPENTRACE</a>
      <nav class="topbar-nav">
        <a href="/" class="nav-item {{if eq .Nav "overview"}}active{{end}}">overview</a>
        <span class="nav-sep">|</span>
        <a href="/alerts" class="nav-item {{if eq .Nav "alerts"}}active{{end}}">
          alerts<span id="alert-badge" class="nav-badge" style="display:none">0</span>
        </a>
        <a href="/logs" class="nav-item {{if eq .Nav "logs"}}active{{end}}">logs</a>
        <span class="nav-sep">|</span>
        <a href="/watchers" class="nav-item {{if eq .Nav "watchers"}}active{{end}}">watchers</a>
        <a href="/connectors" class="nav-item {{if eq .Nav "connectors"}}active{{end}}">connectors</a>
        <a href="/servers" class="nav-item {{if eq .Nav "servers"}}active{{end}}">servers</a>
        <span class="nav-sep">|</span>
        <a href="/setup" class="nav-item {{if eq .Nav "setup"}}active{{end}}">setup</a>
      </nav>
      <div class="topbar-right">
        {{if .User}}
        <div class="user-dropdown">
          <button class="user-dropdown-toggle" onclick="toggleUserMenu()">
            {{.User.DisplayName}}
            {{if .IsAdmin}}<span class="badge badge-type">admin</span>{{end}}
            <span class="dropdown-arrow">&#9662;</span>
          </button>
          <div class="user-dropdown-menu" id="user-dropdown-menu">
            {{if .IsAdmin}}<a href="/admin/users" class="dropdown-item">users</a>{{end}}
            {{if .IsAdmin}}<a href="/admin/settings" class="dropdown-item">settings</a>{{end}}
            <a href="/profile" class="dropdown-item">profile</a>
            <div class="dropdown-divider"></div>
            <form method="POST" action="/logout"><button type="submit" class="dropdown-item dropdown-item-danger">logout</button></form>
          </div>
        </div>
        {{end}}
        <button class="theme-toggle" onclick="cycleTheme()" id="theme-btn" title="Toggle theme">
          <span id="theme-icon">&#9684;</span> <span id="theme-label">system</span>
        </button>
      </div>
    </div>
  </header>
  <main class="content">
    <div class="content-container">
      {{template "content" .}}
    </div>
  </main>
  <script>
  (function(){
    function updateBadge() {
      fetch('/api/alerts/count').then(function(r){return r.json()}).then(function(d){
        var b=document.getElementById('alert-badge');
        if(b){b.textContent=d.count;b.style.display=d.count>0?'inline':'none';}
      }).catch(function(){});
    }
    updateBadge();
    setInterval(updateBadge, 30000);
  })();

  (function(){
    var themes = ['system', 'dark', 'light'];
    var icons = {'system': '\u25D4', 'dark': '\u25CF', 'light': '\u25CB'};

    function getTheme() {
      return localStorage.getItem('opentrace-theme') || 'system';
    }

    function applyTheme(t) {
      if (t === 'dark' || t === 'light') {
        document.documentElement.setAttribute('data-theme', t);
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      var icon = document.getElementById('theme-icon');
      var label = document.getElementById('theme-label');
      if (icon) icon.textContent = icons[t] || icons['system'];
      if (label) label.textContent = t;
    }

    window.cycleTheme = function() {
      var current = getTheme();
      var idx = themes.indexOf(current);
      var next = themes[(idx + 1) % themes.length];
      localStorage.setItem('opentrace-theme', next);
      applyTheme(next);
    };

    applyTheme(getTheme());
  })();

  (function(){
    window.toggleUserMenu = function() {
      var menu = document.getElementById('user-dropdown-menu');
      if (menu) menu.classList.toggle('show');
    };
    document.addEventListener('click', function(e) {
      var dropdown = document.querySelector('.user-dropdown');
      var menu = document.getElementById('user-dropdown-menu');
      if (menu && dropdown && !dropdown.contains(e.target)) {
        menu.classList.remove('show');
      }
    });
  })();
  </script>
  {{if .DevMode}}<script>(function(){var h='';setInterval(function(){fetch('/api/dev/hash').then(function(r){return r.text()}).then(function(v){if(h&&v!==h)location.reload();h=v}).catch(function(){})},1000)})();</script>{{end}}
</body>
</html>{{end}}
