{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenTrace{{if .Title}} — {{.Title}}{{end}}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
</head>
<body>
  {{if eq .Nav "investigate"}}
    {{template "content" .}}
  {{else}}
    <header class="header">
      <div class="container">
        <span class="logo">OPENTRACE</span>
        <nav>
          <a href="/" {{if eq .Nav "investigate"}}class="active"{{end}}>investigate</a>
          <a href="/logs" {{if eq .Nav "logs"}}class="active"{{end}}>logs</a>
          <a href="/connectors" {{if eq .Nav "connectors"}}class="active"{{end}}>connectors</a>
        </nav>
      </div>
    </header>
    <main>
      <div class="container">
        {{template "content" .}}
      </div>
    </main>
  {{end}}
  {{if .DevMode}}<script>(function(){var h='';setInterval(function(){fetch('/api/dev/hash').then(function(r){return r.text()}).then(function(v){if(h&&v!==h)location.reload();h=v}).catch(function(){})},1000)})();</script>{{end}}
</body>
</html>{{end}}
