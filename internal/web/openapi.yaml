openapi: 3.0.3
info:
  title: OpenTrace API
  description: |
    OpenTrace is a self-hosted observability platform for Ruby on Rails applications.
    It provides log ingestion, error tracking, performance monitoring, health checks,
    user journey analysis, and an AI-powered watch system.

    ## Authentication

    The API uses three authentication schemes:

    - **ApiKeyAuth** -- Bearer token for log/metric ingestion endpoints. Configure via `OPENTRACE_API_KEY` or the Settings UI.
    - **SessionAuth** -- Cookie-based session for browser access. Obtain by POSTing to `/login`.
    - **MCPTokenAuth** -- Bearer token for MCP (Model Context Protocol) connections. Each user has a unique MCP token.
  version: "1.0.0"
  contact:
    name: OpenTrace
    url: https://github.com/adham90/opentrace

servers:
  - url: /

tags:
  - name: Auth
    description: Login, registration, and logout
  - name: Public
    description: Unauthenticated health and version endpoints
  - name: Ingestion
    description: Log and metric ingestion (API key auth)
  - name: Logs
    description: Log reading and polling
  - name: Connectors
    description: Data source connector management
  - name: Servers
    description: Server and VM monitoring
  - name: Watches
    description: Agent-first metric threshold monitors
  - name: Errors
    description: Error group tracking and impact analysis
  - name: HealthChecks
    description: HTTP endpoint uptime monitoring
  - name: Trends
    description: Time-series trend data and deploy markers
  - name: Analytics
    description: Traffic analytics, endpoint stats, and heatmaps
  - name: Journeys
    description: User journey, session timeline, and funnel analysis
  - name: MCP
    description: MCP activity monitoring
  - name: Users
    description: User management (admin)
  - name: Settings
    description: System settings and audit log (admin)

security: []

paths:
  # ── Auth ──────────────────────────────────────────────────────────────
  /login:
    post:
      tags: [Auth]
      summary: Log in
      description: Authenticate with email and password. Sets a session cookie on success.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                remember:
                  type: string
                  description: Set to "on" for a long-lived session
      responses:
        "302":
          description: Redirect to dashboard on success or back to login on failure
        "429":
          description: Rate limited

  /register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                display_name:
                  type: string
      responses:
        "302":
          description: Redirect to dashboard on success

  /logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Destroys the current session.
      responses:
        "302":
          description: Redirect to login page

  # ── Public ────────────────────────────────────────────────────────────
  /healthz:
    get:
      tags: [Public]
      summary: Health check
      description: Returns server health status including database connectivity.
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  version:
                    type: string
                  database:
                    type: string
                    enum: [ok, error]
        "503":
          description: Server is degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/version:
    get:
      tags: [Public]
      summary: Server version and capabilities
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  commit:
                    type: string
                  date:
                    type: string
                  is_docker:
                    type: boolean
                  api_version:
                    type: integer
                  min_client_api_version:
                    type: integer
                  capabilities:
                    type: array
                    items:
                      type: string

  /api/version/check:
    get:
      tags: [Public]
      summary: Check for updates
      parameters:
        - name: force
          in: query
          schema:
            type: string
            enum: ["1"]
          description: Set to "1" to bypass cache
      responses:
        "200":
          description: Update check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_version:
                    type: string
                  update_available:
                    type: boolean
                  latest_version:
                    type: string
                  release_url:
                    type: string

  /api/agent/install.sh:
    get:
      tags: [Public]
      summary: Agent install script
      description: Returns a bash script for installing the OpenTrace VM agent.
      responses:
        "200":
          description: Bash install script
          content:
            text/plain:
              schema:
                type: string

  # ── Ingestion ─────────────────────────────────────────────────────────
  /api/logs:
    post:
      tags: [Ingestion]
      summary: Ingest logs
      description: |
        Accepts a single log object or an array of log objects.
        Supports batch deduplication via the `X-Batch-ID` header.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: X-Batch-ID
          in: header
          schema:
            type: string
          description: Unique batch identifier for deduplication
        - name: X-API-Version
          in: header
          schema:
            type: integer
          description: Client API version for compatibility checks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/LogIngest"
                - type: array
                  items:
                    $ref: "#/components/schemas/LogIngest"
      responses:
        "201":
          description: Logs ingested successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
        "200":
          description: Batch deduplicated (already received)
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  deduplicated:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/servers/register:
    post:
      tags: [Ingestion]
      summary: Register a server
      description: Register or update a server for metric collection.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterServerParams"
      responses:
        "200":
          description: Server registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_id:
                    type: string
                    format: uuid
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/servers/{id}/metrics:
    post:
      tags: [Ingestion]
      summary: Push server metrics
      description: Push metric samples for a registered server.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ServerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [samples]
              properties:
                timestamp:
                  type: string
                  format: date-time
                samples:
                  type: array
                  items:
                    $ref: "#/components/schemas/MetricSample"
      responses:
        "200":
          description: Metrics recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Servers]
      summary: Query server metrics
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ServerID"
        - name: name
          in: query
          schema:
            type: string
          description: Filter by metric name
        - name: start
          in: query
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Metric data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricPoint"

  # ── Read API ──────────────────────────────────────────────────────────
  /api/services:
    get:
      tags: [Logs]
      summary: List distinct services
      security:
        - SessionAuth: []
      responses:
        "200":
          description: List of service names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/event_types:
    get:
      tags: [Logs]
      summary: List distinct event types
      security:
        - SessionAuth: []
      responses:
        "200":
          description: List of event type names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/overview:
    get:
      tags: [Logs]
      summary: Dashboard overview
      security:
        - SessionAuth: []
      responses:
        "200":
          description: Overview counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: integer
                  connectors:
                    type: integer
                  servers:
                    type: integer

  /api/tools:
    get:
      tags: [Logs]
      summary: List available MCP tools
      security:
        - SessionAuth: []
      responses:
        "200":
          description: Tool catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                    access:
                      type: string
                    requires:
                      type: string

  /api/logs/poll:
    get:
      tags: [Logs]
      summary: Poll for new logs
      description: Long-poll endpoint for real-time log updates. Returns HTML fragments or empty 200.
      security:
        - SessionAuth: []
      parameters:
        - name: since_id
          in: query
          schema:
            type: integer
            format: int64
          description: Return logs newer than this ID
      responses:
        "200":
          description: New log entries (HTML) or empty if no new logs

  /api/logs/{id}:
    get:
      tags: [Logs]
      summary: Get log entry detail
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogEntry"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Connectors ────────────────────────────────────────────────────────
  /api/connectors:
    get:
      tags: [Connectors]
      summary: List connectors
      security:
        - SessionAuth: []
      responses:
        "200":
          description: List of data sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataSource"
    post:
      tags: [Connectors]
      summary: Create a connector
      description: Admin only.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDataSourceParams"
      responses:
        "201":
          description: Connector created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/connectors/{id}:
    get:
      tags: [Connectors]
      summary: Get connector by ID
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ConnectorID"
      responses:
        "200":
          description: Connector details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSource"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Connectors]
      summary: Update a connector
      description: Admin only.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ConnectorID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDataSourceParams"
      responses:
        "200":
          description: Connector updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSource"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Connectors]
      summary: Delete a connector
      description: Admin only.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ConnectorID"
      responses:
        "204":
          description: Connector deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/connectors/{id}/test:
    post:
      tags: [Connectors]
      summary: Test connector connectivity
      description: Admin only.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ConnectorID"
      responses:
        "200":
          description: Connector test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSource"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Servers ───────────────────────────────────────────────────────────
  /api/servers:
    get:
      tags: [Servers]
      summary: List servers
      security:
        - SessionAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Server"

  /api/servers/{id}:
    get:
      tags: [Servers]
      summary: Get server by ID
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ServerID"
      responses:
        "200":
          description: Server details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Servers]
      summary: Update server
      description: Admin only. Update display name or other user-facing fields.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ServerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServerParams"
      responses:
        "200":
          description: Server updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Servers]
      summary: Delete server
      description: Admin only.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ServerID"
      responses:
        "204":
          description: Server deleted
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Watches ───────────────────────────────────────────────────────────
  /api/watches:
    get:
      tags: [Watches]
      summary: List watches
      security:
        - SessionAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, triggered, resolved, expired]
        - name: service
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of watches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Watch"
    post:
      tags: [Watches]
      summary: Create a watch
      description: Admin only.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWatchParams"
      responses:
        "201":
          description: Watch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Watch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/watches/{id}:
    get:
      tags: [Watches]
      summary: Get watch by ID
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/WatchID"
      responses:
        "200":
          description: Watch details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Watch"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Watches]
      summary: Delete a watch
      description: Admin only.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/WatchID"
      responses:
        "204":
          description: Watch deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/watches/{id}/runs:
    get:
      tags: [Watches]
      summary: List watch runs
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/WatchID"
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of watch runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchRun"

  /api/watches/{id}/alerts:
    get:
      tags: [Watches]
      summary: List watch alerts
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/WatchID"
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of watch alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchAlert"

  /api/watches/alerts/{alertId}:
    get:
      tags: [Watches]
      summary: Get a watch alert
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AlertID"
      responses:
        "200":
          description: Watch alert details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchAlert"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/watches/alerts/count:
    get:
      tags: [Watches]
      summary: Count active alerts
      security:
        - SessionAuth: []
      responses:
        "200":
          description: Alert count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  /api/watches/alerts/{alertId}/dismiss:
    post:
      tags: [Watches]
      summary: Dismiss an alert
      description: Admin only.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AlertID"
      responses:
        "204":
          description: Alert dismissed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/watches/alerts/{alertId}/acknowledge:
    post:
      tags: [Watches]
      summary: Acknowledge an alert
      description: Admin only.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AlertID"
      responses:
        "204":
          description: Alert acknowledged
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Error Groups ──────────────────────────────────────────────────────
  /api/errors:
    get:
      tags: [Errors]
      summary: List error groups
      security:
        - SessionAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [unresolved, resolved, ignored]
        - name: service
          in: query
          schema:
            type: string
        - name: environment
          in: query
          schema:
            type: string
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [occurrence_count, last_seen_at, first_seen_at]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of error groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErrorGroup"

  /api/errors/{fingerprint}:
    get:
      tags: [Errors]
      summary: Get error group with events
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Fingerprint"
      responses:
        "200":
          description: Error group with lifecycle events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorGroup"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/errors/{fingerprint}/resolve:
    post:
      tags: [Errors]
      summary: Resolve an error group
      description: Admin only.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Fingerprint"
      responses:
        "200":
          description: Error resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: resolved
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/errors/{fingerprint}/ignore:
    post:
      tags: [Errors]
      summary: Ignore an error group
      description: Admin only.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Fingerprint"
      responses:
        "200":
          description: Error ignored
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ignored
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/errors/impact/top:
    get:
      tags: [Errors]
      summary: Top errors by user impact
      security:
        - SessionAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [unresolved, resolved, ignored]
        - name: service
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [impact_score, unique_users, occurrence_count, last_seen]
      responses:
        "200":
          description: Error groups ranked by impact
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErrorImpact"

  /api/errors/user/{userID}:
    get:
      tags: [Errors]
      summary: Errors affecting a specific user
      security:
        - SessionAuth: []
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Error summaries for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErrorSummary"

  /api/errors/{fingerprint}/impact:
    get:
      tags: [Errors]
      summary: Get impact details for an error
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Fingerprint"
      responses:
        "200":
          description: Error impact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorImpact"

  /api/errors/{fingerprint}/affected-users:
    get:
      tags: [Errors]
