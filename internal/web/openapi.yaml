components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: API key for log/metric ingestion. Set via OPENTRACE_API_KEY env var or Settings UI.
    SessionAuth:
      type: apiKey
      in: cookie
      name: session_token
      description: Session cookie obtained by logging in via POST /login.
    MCPTokenAuth:
      type: http
      scheme: bearer
      description: Per-user MCP token for Model Context Protocol connections.

  parameters:
    ConnectorID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServerID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WatchID:
      name: id
      in: path
      required: true
      schema:
        type: string
    AlertID:
      name: alertId
      in: path
      required: true
      schema:
        type: string
    Fingerprint:
      name: fingerprint
      in: path
      required: true
      schema:
        type: string
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
